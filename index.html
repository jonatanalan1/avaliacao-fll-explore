async function importPeople(rows) {
  const ev = currentEvent();
  let created = 0, linked = 0;
  const creds = [], errors = [];
  ui.silent = true;
  for (const r of rows) {
    const cpf = cpfFromCell(pick(r, "cpf"));
    const name = pick(r, "nome", "nome completo", "voluntario");
    const room = await roomByName(ev.id, pick(r, "sala"));
    let roles = parseRoleList(pick(r, "funcoes", "funcao", "perfil", "papel"));
    if (!roles.length) roles = ["avaliador"];
    if (roles.includes("regional") && !can.nac()) { roles = roles.filter((x) => x !== "regional"); errors.push(`Linha ${r._linha} (${name || cpf}): Operador Regional ignorado — só a Operação Nacional nomeia.`); }
    if (cpf.length !== 11) { errors.push(`Linha ${r._linha}: CPF inválido (${pick(r, "cpf") || "vazio"}).`); continue; }
    if (!roles.length) roles = ["avaliador"];
    const cur = store.get("users", "vol-" + cpf);
    if (cur) {
      const had = cur.roles?.[ev.id] || [];
      await store.put("users", { ...cur, name: name || cur.name, active: true, roles: { ...(cur.roles || {}), [ev.id]: ROLE_ORDER.filter((x) => had.includes(x) || roles.includes(x)) },
        rooms: { ...(cur.rooms || {}), [ev.id]: room || judgeRoomId(cur, ev.id) } });
      linked++;
      continue;
    }
    if (!name) { errors.push(`Linha ${r._linha} (${fmtCPF(cpf)}): sem nome.`); continue; }
    let pw = pick(r, "senha");
    if (!pw) { pw = randPassword(8); creds.push({ name, login: fmtCPF(cpf), pw }); }
    const salt = randSalt();
    await store.put("users", { id: "vol-" + cpf, cpf, name, salt, pwHash: await hashPw(salt, pw), active: true, nacional: false, roles: { [ev.id]: roles }, rooms: { [ev.id]: room }, createdAt: nowISO() });
    created++;
  }
  ui.silent = false;
  await store.audit(ev.id, "Importação de voluntários", `${created} novos, ${linked} já existentes, ${errors.length} com erro`);
  render();
  importReport("Voluntários importados", [["Novos", created], ["Já cadastrados (vinculados)", linked], ["Com problema", errors.length]], creds, errors);
}

function regionalConflict(key, evId) {
  const ev = store.get("events", evId);
  if (ev?.type !== "regional") return null;
  const t = store.all("teams").find((x) => x.key === key && x.eventId !== evId && store.get("events", x.eventId)?.type === "regional");
  return t ? store.get("events", t.eventId) : null;
}

async function importTeams(rows) {
  const ev = currentEvent();
  let created = 0, updated = 0;
  const creds = [], errors = [];
  ui.silent = true;
  for (const r of rows) {
    const name = pick(r, "equipe", "nome da equipe", "nome", "time");
    const key = norm(name);
    if (!key) { errors.push(`Linha ${r._linha}: sem nome de equipe.`); continue; }
    const clash = regionalConflict(key, ev.id);
    if (clash) { errors.push(`Linha ${r._linha} (${name}): já está no regional "${clash.name}".`); continue; }
    const info = { number: pick(r, "numero", "n", "no", "nº", "n°"), school: pick(r, "escola", "instituicao"), city: pick(r, "cidade", "municipio"), coach: pick(r, "tutor", "tutora", "tutor(a)", "tecnico", "tecnica", "responsavel") };
    let pw = pick(r, "senha");
    const roomTxt = pick(r, "sala");
    const cur = teamsOf(ev.id).find((x) => x.key === key);
    const rec = { ...(cur || { id: uid("tm"), eventId: ev.id, createdAt: nowISO() }), name, key };
    Object.entries(info).forEach(([k, v]) => { if (v || !cur) rec[k] = v; });
    if (roomTxt) rec.roomId = await roomByName(ev.id, roomTxt);
    if (!cur && !pw) { pw = randPassword(8); creds.push({ name, login: name, pw }); }
    if (pw) { rec.salt = randSalt(); rec.pwHash = await hashPw(rec.salt, pw); }
    await store.put("teams", rec);
    cur ? updated++ : created++;
  }
  ui.silent = false;
  await store.audit(ev.id, "Importação de equipes", `${created} novas, ${updated} atualizadas, ${errors.length} com erro`);
  render();
  importReport("Equipes importadas", [["Novas", created], ["Atualizadas", updated], ["Com problema", errors.length]], creds, errors);
}

/* ============================================================
   8.10 NIVELAMENTO — gráfico de linhas com três lentes
   • Por avaliador: média de cada avaliador × média do evento, e as
     equipes que ele viu, destacando a que foge do padrão dele.
   • Por equipe: uma linha por avaliador da equipe; alertas de
     discrepância (um avaliador longe dos outros) e simulação sem
     uma avaliação.
   • Por sala: média de cada sala × média do evento.
   Avaliações "tiradas da análise" só valem nesta tela.
   ============================================================ */
const CHART_COLORS = {
  light: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7"],
  dark: ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9"],
};
const NV_MAX = CHART_COLORS.light.length;
function isDark() {
  const t = document.documentElement.getAttribute("data-theme");
  return t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches);
}
function nvState() {
  if (!ui.nv) {
    let disc = 1;
    try { disc = [0.75, 1, 1.5].includes(+localStorage.getItem("explore.disc")) ? +localStorage.getItem("explore.disc") : 1; } catch (e) { /* ignora */ }
    ui.nv = { lens: "aval", gran: "cat", sel: { aval: null, sala: null }, team: null, excl: new Set(), disc, colors: { aval: {}, sala: {}, eq: {} } };
  }
  if (ui.nv.ev !== session.eventId) { ui.nv.ev = session.eventId; ui.nv.sel = { aval: null, sala: null }; ui.nv.team = null; ui.nv.excl = new Set(); ui.nv.colors = { aval: {}, sala: {}, eq: {} }; }
  return ui.nv;
}
/* cor segue a entidade: ganha o primeiro espaço livre e fica com ele */
function colorSlot(map, id, activeIds) {
  if (map[id] === undefined || activeIds.some((o) => o !== id && map[o] === map[id])) {
    const used = new Set(activeIds.filter((o) => o !== id).map((o) => map[o]));
    let i = 0; while (used.has(i)) i++;
    map[id] = i;
  }
  return CHART_COLORS[isDark() ? "dark" : "light"][map[id] % NV_MAX];
}
function nvAxis(gran) {
  if (gran === "cat") return CAT_ORDER.map((k) => ({ id: k, label: CAT[k].short, crits: RUBRIC.find((s) => s.id === k).crits.map((c) => c.id) }));
  return CAT_ORDER.flatMap((k) => RUBRIC.find((s) => s.id === k).crits.map((c) => ({ id: c.id, label: c.short, group: CAT[k].short, crits: [c.id] })));
}
function meanOn(evals, x) {
  const v = evals.flatMap((e) => x.crits.map((c) => e.scores?.[c]).filter(Boolean));
  return v.length ? avg(v) : null;
}
function evalMean(e) { return avg(ALL_CRITS.map((c) => e.scores?.[c.id]).filter(Boolean)) ?? 0; }

/* ---------- gráfico de linhas (SVG) ---------- */
function lineChart(axis, series, opts = {}) {
  const W = 920, H = opts.height || 300, L = 40, Rm = series.length <= 4 ? 130 : 24, T = 14;
  const B = axis.some((x) => x.group) ? 76 : 34;
  /* nome do critério em até 2 linhas */
  const wrap = (t) => {
    if (t.length <= 12) return [t];
    const w = t.split(" "); let a = "", i = 0;
    while (i < w.length && (a + " " + w[i]).trim().length <= Math.ceil(t.length / 2) + 2) a = (a + " " + w[i++]).trim();
    return [a || w[i++], w.slice(i).join(" ")].filter(Boolean);
  };
  const pw = W - L - Rm, ph = H - T - B;
  const xs = axis.map((_, i) => L + (axis.length === 1 ? pw / 2 : (i * pw) / (axis.length - 1)));
  const y = (v) => T + ph - ((v - 1) / 3) * ph;
  const grid = [1, 2, 3, 4].map((v) => `<line x1="${L}" x2="${L + pw}" y1="${y(v)}" y2="${y(v)}" class="lc-grid"/><text x="${L - 10}" y="${y(v) + 4}" class="lc-tick" text-anchor="end">${v}</text>`).join("");
  const xl = axis.map((x, i) => `<text x="${xs[i]}" y="${T + ph + 18}" class="lc-xl" text-anchor="middle">${wrap(x.label).map((l, j) => `<tspan x="${xs[i]}" dy="${j ? 14 : 0}">${esc(l)}</tspan>`).join("")}</text>`).join("");
  let groups = "";
  if (axis.some((x) => x.group)) {
    const seen = [];
    axis.forEach((x, i) => { const g = seen.find((s) => s.name === x.group); g ? (g.to = i) : seen.push({ name: x.group, from: i, to: i }); });
    groups = seen.map((g, gi) => `<text x="${(xs[g.from] + xs[g.to]) / 2}" y="${T + ph + 60}" class="lc-grp" text-anchor="middle">${esc(g.name)}</text>
      ${gi ? `<line x1="${(xs[g.from] + xs[g.from - 1]) / 2}" x2="${(xs[g.from] + xs[g.from - 1]) / 2}" y1="${T}" y2="${T + ph + 64}" class="lc-sep"/>` : ""}`).join("");
  }
  const path = (vals) => {
    let d = "", pen = false;
    vals.forEach((v, i) => { if (v === null || v === undefined) { pen = false; return; } d += `${pen ? "L" : "M"}${xs[i].toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
    return d;
  };
  const lines = series.map((s) => `<path d="${path(s.values)}" class="lc-line ${s.kind || ""}" style="stroke:${s.color}"/>`).join("");
  const dots = series.filter((s) => s.kind !== "ref").map((s) => s.values.map((v, i) => v === null || v === undefined ? "" :
    `<circle cx="${xs[i]}" cy="${y(v)}" r="${s.kind === "bold" ? 5 : 4}" class="lc-dot" style="fill:${s.color}"/>`).join("")).join("");
  /* rótulos diretos no fim da linha (até 4 séries), sem se sobrepor */
  let labels = "";
  if (series.length <= 4) {
    const end = series.map((s) => { let i = s.values.length - 1; while (i >= 0 && (s.values[i] === null || s.values[i] === undefined)) i--; return i < 0 ? null : { s, yy: y(s.values[i]) }; }).filter(Boolean).sort((a, b) => a.yy - b.yy);
    for (let i = 1; i < end.length; i++) if (end[i].yy - end[i - 1].yy < 14) end[i].yy = end[i - 1].yy + 14;
    labels = end.map(({ s, yy }) => `<text x="${L + pw + 10}" y="${yy + 4}" class="lc-lab">${esc(s.short || s.label)}</text>`).join("");
  }
  const hits = axis.map((x, i) => {
    const x0 = i === 0 ? L - 10 : (xs[i] + xs[i - 1]) / 2, x1 = i === axis.length - 1 ? L + pw + 10 : (xs[i] + xs[i + 1]) / 2;
    return `<rect x="${x0}" y="${T}" width="${x1 - x0}" height="${ph}" class="lc-hit" data-i="${i}"/>`;
  }).join("");
  const legend = `<div class="lc-legend">${series.map((s) => `<span class="lc-key"><span class="lc-sw ${s.kind || ""}" style="--c:${s.color}"></span>${esc(s.label)}</span>`).join("")}</div>`;
  const id = "lc" + Math.random().toString(36).slice(2, 7);
  const html = `<div class="lc-wrap" id="${id}">${legend}
    <div class="lc-box"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${attr(opts.title || "Gráfico de linhas")}">
      ${grid}${groups}${xl}<line class="lc-cross" x1="0" x2="0" y1="${T}" y2="${T + ph}" style="display:none"/>${lines}${dots}${labels}${hits}
    </svg><div class="lc-tip" hidden></div></div></div>`;
  const bind = () => {
    const box = $(`#${id} .lc-box`), svg = $("svg", box), tip = $(".lc-tip", box), cross = $(".lc-cross", svg);
    $$(".lc-hit", svg).forEach((r) => {
      r.addEventListener("mouseenter", () => {
        const i = +r.dataset.i;
        cross.setAttribute("x1", xs[i]); cross.setAttribute("x2", xs[i]); cross.style.display = "";
        const rows = series.map((s) => ({ s, v: s.values[i] })).filter((o) => o.v !== null && o.v !== undefined).sort((a, b) => b.v - a.v);
        tip.innerHTML = `<b>${esc(axis[i].group ? axis[i].group + " · " : "")}${esc(axis[i].label)}</b>${rows.map((o) =>
          `<div class="lc-tr"><span class="lc-sw ${o.s.kind || ""}" style="--c:${o.s.color}"></span><span>${esc(o.s.label)}</span><b class="mono">${fmt(o.v, 2)}</b></div>`).join("")}`;
        tip.hidden = false;
        const bw = box.clientWidth, px = (xs[i] / W) * bw;
        tip.style.left = Math.min(Math.max(px + 12, 0), bw - tip.offsetWidth - 4) + "px";
        if (px + 12 + tip.offsetWidth > bw) tip.style.left = Math.max(px - tip.offsetWidth - 12, 0) + "px";
        tip.style.top = "8px";
      });
      r.addEventListener("mouseleave", () => { tip.hidden = true; cross.style.display = "none"; });
    });
  };
  return { html, bind };
}

/* ---------- cálculos ---------- */
function nvData() {
  const st = nvState();
  const allSent = evalsOfEvent().filter((e) => e.status === "sent");
  const sent = allSent.filter((e) => !st.excl.has(e.id));
  const byTeam = {};
  sent.forEach((e) => { (byTeam[e.teamId] = byTeam[e.teamId] || []).push(e); });
  /* desvio de uma avaliação: média das notas dela − média das notas dos outros avaliadores da mesma equipe */
  const devOf = (e) => {
    const others = (byTeam[e.teamId] || []).filter((o) => o !== e);
    if (!others.length) return null;
    const d = ALL_CRITS.map((c) => { const v = e.scores?.[c.id], ov = others.map((o) => o.scores?.[c.id]).filter(Boolean); return v && ov.length ? v - avg(ov) : null; }).filter((x) => x !== null);
    return d.length ? avg(d) : null;
  };
  return { st, allSent, sent, byTeam, devOf };
}
/* alertas: um avaliador longe da média dos outros na mesma equipe */
function discrepancies(sent, thr) {
  const byTeam = {};
  sent.forEach((e) => { (byTeam[e.teamId] = byTeam[e.teamId] || []).push(e); });
  const out = [];
  Object.values(byTeam).forEach((list) => {
    if (list.length < 2) return;
    /* só 2 avaliadores: não dá para saber quem destoa — vira um alerta único de divergência */
    if (list.length === 2) {
      const [a, b] = list.sort((x, y) => evalMean(y) - evalMean(x));
      const d = evalMean(a) - evalMean(b);
      if (d >= thr) out.push({ e: a, pair: b, m: evalMean(a), o: evalMean(b), d });
      return;
    }
    list.forEach((e) => {
      const m = evalMean(e), o = avg(list.filter((x) => x !== e).map(evalMean));
      if (Math.abs(m - o) >= thr) out.push({ e, m, o, d: m - o });
    });
  });
  return out.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
}

function renderNivel(root) {

      <div class="card nv-chart">${chart.html}<p class="small muted lc-cap">Média das notas que cada avaliador deu, de 1 a 4. A linha tracejada é a média do evento. Passe o mouse para ver os valores.</p></div>

      ${team ? `<div class="card nv-chart">${chart.html}<p class="small muted lc-cap">Uma linha por avaliador; a linha escura é a média da equipe com as avaliações marcadas; a tracejada é a média do evento. Desmarque uma avaliação para ver a equipe sem ela.</p></div>

      <div class="card nv-chart">${chart.html}<p class="small muted lc-cap">Média das notas dadas em cada sala, de 1 a 4. As salas avaliam equipes diferentes: a comparação é justa quando as equipes foram sorteadas entre as salas.</p></div>
      <div class="card"><div class="tbl-wrap"><table>

        <tbody>${rooms.map((x) => { const m = avg(x.evals.map(evalMean)); return `<tr>

  root.innerHTML = `
    <div class="page-head">

  $$("[data-open-team]").forEach((a) => a.addEventListener("click", () => { session.tab = "painel"; session.save(); openTeamDetail(a.dataset.openTeam); }));
}

/* equipes que o avaliador viu: desvio em cada uma × o padrão dele */
function judgeTeamsPanel(j, devOf, st) {
  const rows = j.mine.map((e) => ({ e, d: devOf(e), m: evalMean(e) })).filter((x) => x.d !== null);
  if (!rows.length) return "";
  const typical = rows.map((x) => x.d).sort((a, b) => a - b)[Math.floor(rows.length / 2)];
  rows.forEach((x) => { x.out = Math.abs(x.d - typical) >= st.disc; });
  rows.sort((a, b) => b.d - a.d);
  const X = (d) => 50 + (Math.max(-2, Math.min(2, d)) / 2) * 50;
  const color = colorSlot(st.colors.aval, j.v.id, st.sel.aval);
  const outs = rows.filter((x) => x.out);
  return `<div class="card nv-judge">
    <div class="row g-sm wrap" style="margin-bottom:var(--sp-sm)"><span class="lc-sw" style="--c:${color}"></span><h3 style="font-size:16px">${esc(j.v.name)}</h3>
      <span class="small muted">${rows.length} equipe(s) com outros avaliadores · padrão dele: ${fmtDev(typical)} vs. colegas</span>
      ${outs.length ? `<span class="chip chip-warn right"><span class="msym">priority_high</span>${outs.length} fora do padrão dele</span>` : `<span class="chip chip-ok right"><span class="msym">check</span>Coerente entre as equipes</span>`}</div>
    ${rows.every((x) => (x.peers || 1) === 1) && rows.every((x) => evalsOfTeam(x.e.teamId).filter((o) => o.status === "sent").length === 2)
      ? `<p class="small muted" style="margin-bottom:var(--sp-2xs)"><span class="msym sm" style="vertical-align:-3px">info</span> Nas equipes dele há só um colega: o desvio de um é o espelho do outro. Para saber quem destoa, compare as linhas com a média do evento no gráfico.</p>` : ""}
    <div class="strip" role="img" aria-label="Desvio por equipe">
      <span class="strip-axis"></span><span class="strip-zero" style="left:50%"></span><span class="strip-typ" style="left:${X(typical)}%" title="Padrão do avaliador"></span>
      ${rows.map((x) => `<button class="strip-dot ${x.out ? "out" : ""}" style="left:${X(x.d)}%;--c:${color}" data-nvteam="${attr(x.e.teamId)}" title="${attr(x.e.teamName || "")}: ${fmtDev(x.d)} vs. colegas"></button>`).join("")}
      <span class="strip-l">−2 · mais baixo que os colegas</span><span class="strip-r">mais alto que os colegas · +2</span>
    </div>
    <div class="tbl-wrap" style="margin-top:var(--sp-md)"><table>
      <thead><tr><th>Equipe</th><th class="num">Média dele</th><th class="num">Média dos colegas</th><th class="mid">Diferença</th><th></th></tr></thead>
      <tbody>${rows.map((x) => `<tr class="${x.out ? "nv-out" : ""}">
        <td>${esc(x.e.teamName || store.get("teams", x.e.teamId)?.name || "—")} <span class="small muted mono">${evalNo(x.e)}</span>
          ${x.out ? `<span class="nv-flag ${x.d > typical ? "up" : "dn"}"><span class="msym sm">priority_high</span>${x.d > typical ? "bem acima do padrão dele" : "bem abaixo do padrão dele"}</span>` : ""}</td>
        <td class="num mono">${fmt(x.m, 2)}</td><td class="num mono">${fmt(x.m - x.d, 2)}</td>
        <td class="mid"><span class="dv-cell ${devClass(x.d, 0.5)}">${fmtDev(x.d)}</span></td>
        <td class="num"><button class="btn btn-text btn-sm" data-nvteam="${attr(x.e.teamId)}">Analisar equipe</button></td>
      </tr>`).join("")}</tbody>
    </table></div>
  </div>`;
}

/* simulação: nota classificatória e rubrica da equipe com e sem as avaliações desmarcadas */
function simulationPanel(team, tEvals, st) {
  const inc = tEvals.filter((e) => !st.excl.has(e.id));
  const score = (list) => list.length ? RUBRIC.reduce((a, sec) => a + avg(list.map((e) => secScore(e, sec))), 0) : null;
  const all = score(tEvals), now = score(inc);
  const changes = inc.length && inc.length !== tEvals.length ? ALL_CRITS.map((c) => ({ c, a: teamLevel(tEvals, c.id), b: teamLevel(inc, c.id) })).filter((x) => x.a !== x.b) : [];
  const lvl = (v) => LEVELS.find((l) => l.v === v)?.label || "—";
  return `<div class="card nv-sim">
    <div class="row g-md wrap">
      <div><div class="small muted">Nota classificatória com todas</div><div class="nv-big mono">${fmtN(all)}</div></div>
      <span class="msym muted">arrow_forward</span>
      <div><div class="small muted">Com as avaliações marcadas</div><div class="nv-big mono">${fmtN(now)}</div></div>
      ${all !== null && now !== null && inc.length !== tEvals.length ? `<span class="dv-cell ${devClass(now - all, 0.5)}" style="font-size:14px;height:30px">${fmtDev(now - all)}</span>` : ""}
      <button class="btn btn-out btn-sm right" data-open-team="${attr(team.id)}"><span class="msym">open_in_new</span>Abrir avaliações da equipe</button>
    </div>
    ${inc.length !== tEvals.length ? `<div class="small" style="margin-top:var(--sp-sm)">${changes.length
      ? `<b>O que a equipe veria diferente na rubrica:</b> ${changes.map((x) => `${esc(x.c.short)}: ${lvl(x.a)} → <b>${lvl(x.b)}</b>`).join(" · ")}`
      : "A rubrica que a equipe vê não mudaria."}</div>` : ""}
  </div>`;
}

/* célula divergente: azul = acima, vermelho = abaixo, cinza = alinhado */
function devClass(d, T) {
  if (d === null || d === undefined || Number.isNaN(d)) return "dv-none";
  const a = Math.abs(d);
  const step = a < T / 2 ? 0 : a < T ? 1 : a < 2 * T ? 2 : 3;
  return step === 0 ? "dv-0" : (d > 0 ? "dv-up" : "dv-dn") + step;
}
const fmtDev = (d) => (d === null || d === undefined || Number.isNaN(d) ? "—" : (d > 0 ? "+" : d < 0 ? "−" : "") + fmt(Math.abs(d), 2));

/* ============================================================
   8.11 SALAS — cada sala tem seus avaliadores e suas equipes
   (Operador Regional e Nacional organizam; o avaliador vê só a
   própria sala; Líder de Avaliação e Nacional veem todas)
   ============================================================ */
function renderRooms(root) {
  const ev = currentEvent();
  const rooms = roomsOf(ev.id);
  const judges = peopleOf(ev.id).filter((u) => u.roles[ev.id].includes("avaliador")).sort(byName);
  const teams = teamsOf(ev.id).sort(byName);
  const valid = new Set(rooms.map((r) => r.id));
  const jRoom = (u) => (valid.has(judgeRoomId(u, ev.id)) ? judgeRoomId(u, ev.id) : "");
  const tRoom = (t) => (valid.has(t.roomId) ? t.roomId : "");
  const noJ = judges.filter((u) => !jRoom(u)), noT = teams.filter((t) => !tRoom(t));
  const sentOf = (t) => evalsOfTeam(t.id).filter((e) => e.status === "sent").length;

  const chip = (kind, id, label, sub) => `<span class="rm-chip ${kind}" draggable="true" data-drag="${kind}:${attr(id)}" title="Arraste para outra sala">
    <span class="msym sm">${kind === "j" ? "person" : "groups"}</span><span class="nm">${esc(label)}</span>${sub ? `<span class="sub">${esc(sub)}</span>` : ""}
    <button class="rm-x" data-unassign="${kind}:${attr(id)}" aria-label="Tirar da sala"><span class="msym sm">close</span></button></span>`;
  const card = (r) => {
    const rj = judges.filter((u) => jRoom(u) === r.id), rt = teams.filter((t) => tRoom(t) === r.id);
    const exp = rj.length * rt.length, done = rt.reduce((a, t) => a + evalsOfTeam(t.id).filter((e) => e.status === "sent" && rj.some((u) => u.id === e.judgeId)).length, 0);
    return `<section class="rm-card" data-drop="${attr(r.id)}">
      <header>
        <span class="msym">meeting_room</span>
        <input class="rm-name" data-rename="${attr(r.id)}" value="${attr(r.name)}" aria-label="Nome da sala">
        <button class="icon-btn sm" data-rmdel="${attr(r.id)}" title="Excluir sala"><span class="msym sm">delete</span></button>
      </header>
      <div class="rm-meta small muted"><b>${rj.length}</b> avaliador(es) · <b>${rt.length}</b> equipe(s) · ${exp ? `${done}/${exp} avaliações` : "—"}</div>
      ${exp ? `<div class="progress" style="margin:4px 0 var(--sp-sm)"><i style="width:${(done / exp) * 100}%"></i></div>` : ""}
      <div class="rm-sec"><div class="rm-sec-t">Avaliadores</div>
        <div class="rm-list">${rj.map((u) => chip("j", u.id, u.name)).join("") || `<span class="small muted">Nenhum</span>`}</div>
        <select class="rm-add" data-addj="${attr(r.id)}"><option value="">+ Adicionar avaliador</option>
          ${judges.filter((u) => jRoom(u) !== r.id).map((u) => `<option value="${attr(u.id)}">${esc(u.name)}${jRoom(u) ? ` (${esc(roomName(jRoom(u)))})` : ""}</option>`).join("")}</select></div>
      <div class="rm-sec"><div class="rm-sec-t">Equipes</div>
        <div class="rm-list">${rt.map((t) => chip("t", t.id, t.name, t.number ? "nº " + t.number : "")).join("") || `<span class="small muted">Nenhuma</span>`}</div>
        <select class="rm-add" data-addt="${attr(r.id)}"><option value="">+ Adicionar equipe</option>
          ${teams.filter((t) => tRoom(t) !== r.id).map((t) => `<option value="${attr(t.id)}">${esc(t.name)}${tRoom(t) ? ` (${esc(roomName(tRoom(t)))})` : ""}</option>`).join("")}</select></div>
    </section>`;
  };

  root.style.maxWidth = "1320px";
  root.innerHTML = `
    <div class="page-head">
      <div class="grow">
        <div class="eyebrow">${eventEyebrow()}</div>
        <h1>Salas</h1>
        <p class="muted small">Cada sala tem os seus avaliadores e as suas equipes. O avaliador só vê as equipes da sala dele; o Líder de Avaliação vê todas. Arraste para mudar de sala.</p>
      </div>
      <div class="row g-2xs wrap no-print">
        <button class="btn btn-out" id="rm-dist"><span class="msym">shuffle</span>Distribuir equipes</button>
        <button class="btn btn-fill" id="rm-new"><span class="msym">add</span>Nova sala</button>
      </div>
    </div>
    <div class="kpi-grid kpi-4" style="margin-bottom:var(--sp-lg)">
      <div class="kpi"><span class="k">Salas</span><span class="v">${rooms.length}</span><span class="sub">neste evento</span></div>
      <div class="kpi"><span class="k">Avaliadores</span><span class="v">${judges.length}</span><span class="sub">${judges.length && rooms.length ? `~${fmt(judges.length / rooms.length, 1)} por sala` : "—"}</span></div>
      <div class="kpi ${noJ.length ? "warn" : ""}"><span class="k">Avaliadores sem sala</span><span class="v">${noJ.length}</span><span class="sub">não veem nenhuma equipe</span></div>
      <div class="kpi ${noT.length ? "warn" : ""}"><span class="k">Equipes sem sala</span><span class="v">${noT.length}</span><span class="sub">de ${teams.length} equipes</span></div>
    </div>
    ${!rooms.length ? `<div class="card">${emptyBox("meeting_room", "Nenhuma sala ainda", "Crie as salas e depois coloque os avaliadores e as equipes em cada uma. \"Distribuir equipes\" divide as equipes sem sala por sorteio.")}</div>` : `
    <div class="rm-grid">
      ${rooms.map(card).join("")}
      <section class="rm-card rm-none" data-drop="">
        <header><span class="msym">inventory_2</span><b>Sem sala</b></header>
        <div class="rm-sec"><div class="rm-sec-t">Avaliadores</div><div class="rm-list">${noJ.map((u) => chip("j", u.id, u.name)).join("") || `<span class="small muted">Todos com sala</span>`}</div></div>
        <div class="rm-sec"><div class="rm-sec-t">Equipes</div><div class="rm-list">${noT.map((t) => chip("t", t.id, t.name, t.number ? "nº " + t.number : "")).join("") || `<span class="small muted">Todas com sala</span>`}</div></div>
      </section>
    </div>`}`;

  const moveJ = async (uid_, roomId) => { const u = store.get("users", uid_); await store.put("users", { ...u, rooms: { ...(u.rooms || {}), [ev.id]: roomId } }); };
  const moveT = async (tid, roomId) => { const t = store.get("teams", tid); await store.put("teams", { ...t, roomId }); };
  const move = async (kind, id, roomId) => { kind === "j" ? await moveJ(id, roomId) : await moveT(id, roomId); render(); };

  $("#rm-new").addEventListener("click", async () => {
    const name = await askText("Nova sala", "Nome da sala", "Ex.: Sala A", `Sala ${String.fromCharCode(65 + rooms.length)}`);
    if (!name) return;
    await store.put("rooms", { id: uid("rm"), eventId: ev.id, name, order: rooms.length, createdAt: nowISO() });
    await store.audit(ev.id, "Sala criada", name);
    render();
  });
  $("#rm-dist").addEventListener("click", () => distributeTeamsModal(rooms, teams, tRoom));
  $$("[data-rename]").forEach((i) => i.addEventListener("change", async () => {
    const r = store.get("rooms", i.dataset.rename);
    const name = i.value.trim();
    if (!name) { i.value = r.name; return; }
    await store.put("rooms", { ...r, name });
    render();
  }));
  $$("[data-rmdel]").forEach((b) => b.addEventListener("click", async () => {
    const r = store.get("rooms", b.dataset.rmdel);
    if (!(await confirmModal("Excluir sala", `<b>${esc(r.name)}</b> será excluída. Os avaliadores e as equipes dela ficam sem sala. As avaliações não são apagadas.`, "Excluir", true))) return;
    ui.silent = true;
    for (const u of judges.filter((x) => jRoom(x) === r.id)) await moveJ(u.id, "");
    for (const t of teams.filter((x) => tRoom(x) === r.id)) await moveT(t.id, "");
    await store.remove("rooms", r.id);
    ui.silent = false;
    await store.audit(ev.id, "Sala excluída", r.name);
    render();
  }));
  $$("[data-addj]").forEach((s) => s.addEventListener("change", () => s.value && move("j", s.value, s.dataset.addj)));
  $$("[data-addt]").forEach((s) => s.addEventListener("change", () => s.value && move("t", s.value, s.dataset.addt)));
  $$("[data-unassign]").forEach((b) => b.addEventListener("click", (e) => { e.stopPropagation(); const [k, id] = b.dataset.unassign.split(/:(.+)/); move(k, id, ""); }));
  /* arrastar e soltar entre salas */
  $$("[data-drag]").forEach((c) => c.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", c.dataset.drag); c.classList.add("dragging"); }));
  $$("[data-drag]").forEach((c) => c.addEventListener("dragend", () => c.classList.remove("dragging")));
  $$("[data-drop]").forEach((z) => {
    z.addEventListener("dragover", (e) => { e.preventDefault(); z.classList.add("over"); });
    z.addEventListener("dragleave", () => z.classList.remove("over"));
    z.addEventListener("drop", (e) => {
      e.preventDefault(); z.classList.remove("over");
      const [k, id] = (e.dataTransfer.getData("text/plain") || "").split(/:(.+)/);
      if (k && id) move(k, id, z.dataset.drop);
    });
  });
}

/* sorteio equilibrado: completa as salas com menos equipes primeiro */
function distributeTeamsModal(rooms, teams, tRoom) {
  if (!rooms.length) return toast("Crie as salas primeiro.", "err");
  const loose = teams.filter((t) => !tRoom(t));
  openModal({
    title: "Distribuir equipes", icon: "shuffle",
    body: `<p style="margin-bottom:var(--sp-md)">As equipes são sorteadas entre as ${rooms.length} salas, deixando todas com quantidades parecidas.</p>
      <div class="stack g-2xs">
        <label class="opt-line"><input type="radio" name="dm" value="loose" checked><span><b>Só as sem sala</b><span class="small muted"> — ${loose.length} equipe(s); quem já tem sala não muda</span></span></label>
        <label class="opt-line"><input type="radio" name="dm" value="all"><span><b>Redistribuir todas</b><span class="small muted"> — sorteia de novo as ${teams.length} equipes</span></span></label>
      </div>`,
    footer: `<button class="btn btn-text" data-close>Cancelar</button><button class="btn btn-fill" data-ok><span class="msym">shuffle</span>Sortear</button>`,
    onMount: (el, close) => {
      $("[data-ok]", el).addEventListener("click", async () => {
        const all = $("input[name=dm]:checked", el).value === "all";
        const pool = shuffled(all ? teams : loose);
        if (!pool.length) { close(); return toast("Todas as equipes já têm sala."); }
        const count = Object.fromEntries(rooms.map((r) => [r.id, all ? 0 : teams.filter((t) => tRoom(t) === r.id).length]));
        close();
        ui.silent = true;
        for (const t of pool) {
          const min = Math.min(...Object.values(count));
          const pickR = shuffled(rooms.filter((r) => count[r.id] === min))[0];
          count[pickR.id]++;
          await store.put("teams", { ...store.get("teams", t.id), roomId: pickR.id });
        }
        ui.silent = false;
        await store.audit(session.eventId, "Equipes distribuídas nas salas", `${pool.length} equipe(s)`);
        render();
        toast(`${pool.length} equipe(s) distribuída(s).`);
      });
    },
  });
}

    b.disabled = false;
    b.innerHTML = `<span class="msym sm">sync</span>Atualizar da planilha`;
  });
}
/* vincula voluntários da base ao evento (opts.nacional = adicionar à Operação Nacional) */
function basePeoplePicker(opts = {}) {
  if (!store.base) return baseNotLoaded();
  const ev = opts.nacional ? null : currentEvent();
  let base = store.base.volunteers.slice().sort(byName);
  const ufs = [...new Set(base.map((v) => v.uf).filter(Boolean))].sort();
  const f = { q: "", uf: "", int: "", login: true };
  const chosen = new Set();
  openModal({
    title: opts.nacional ? "Adicionar à Operação Nacional" : "Vincular voluntários da base", icon: "person_add", size: "wide",
    body: `
      <div class="bp-filters">
        <div class="search-box" style="margin:0;flex:1;min-width:200px"><span class="msym">search</span><input type="text" id="bp-q" placeholder="Nome, CPF ou cidade" autocomplete="off"></div>
        <select id="bp-uf"><option value="">Todas as UF</option>${ufs.map((u) => `<option>${esc(u)}</option>`).join("")}</select>
        <select id="bp-int" title="Interesse em ser avaliador (1 a 4)"><option value="">Interesse avaliador: todos</option><option value="3">Interesse 3 ou 4</option><option value="4">Interesse 4</option></select>
        <label class="check small"><input type="checkbox" id="bp-login" checked> Só quem tem login</label>
        <button type="button" class="btn btn-text btn-sm" id="bp-refresh"><span class="msym sm">sync</span>Atualizar da planilha</button>
      </div>
      <div class="bp-list" id="bp-list"></div>
      ${opts.nacional ? "" : `<div class="bp-foot">
        <div class="field"><label>Funções neste evento</label><div class="row g-md wrap">
          ${ROLE_ORDER.map((r) => `<label class="check"><input type="checkbox" data-brole="${r}" ${r === "avaliador" ? "checked" : ""} ${r === "regional" && !can.nac() ? "disabled" : ""}> ${ROLES[r].label}</label>`).join("")}</div></div>
        <div class="field"><label for="bp-room">Sala</label><select id="bp-room"><option value="">Sem sala</option>${roomsOf(ev.id).map((r) => `<option value="${attr(r.id)}">${esc(r.name)}</option>`).join("")}</select></div>
      </div>`}`,
    footer: `<span class="small muted" id="bp-count">Nenhuma pessoa marcada</span><button class="btn btn-text right" data-close>Cancelar</button>
             <button class="btn btn-fill" data-ok disabled><span class="msym">link</span>${opts.nacional ? "Adicionar" : "Vincular"}</button>`,
    onMount: (el, close) => {
      const draw = () => {
        const q = norm(f.q), qd = onlyDigits(f.q);
        const list = base.filter((v) => (!f.login || v.hasLogin) && (!f.uf || v.uf === f.uf) && (!f.int || +v.interest >= +f.int) &&
          (!q || norm(v.name).includes(q) || norm(v.city).includes(q) || (qd.length >= 3 && v.cpf.includes(qd))));
        $("#bp-list", el).innerHTML = !list.length ? `<p class="small muted" style="padding:var(--sp-md)">Ninguém com esses filtros.</p>` : list.slice(0, 300).map((v) => {
          const u = store.get("users", v.id);
          const here = opts.nacional ? !!u?.nacional : !!(u?.roles?.[ev.id] || []).length;
          return `<label class="bp-row ${here ? "done" : ""}"><input type="${opts.nacional ? "radio" : "checkbox"}" name="bp" data-bp="${attr(v.id)}" ${chosen.has(v.id) ? "checked" : ""} ${here ? "disabled" : ""}>
            <span class="bp-main"><b>${esc(v.name)}</b><span class="small muted">${fmtCPF(v.cpf)} · ${esc([v.city, v.uf].filter(Boolean).join("/"))}</span></span>
            <span class="bp-meta small">${v.interest ? `<span class="chip chip-out" title="Interesse em ser avaliador">aval. ${esc(v.interest)}/4</span>` : ""}${!v.hasLogin ? `<span class="chip chip-warn">sem login</span>` : ""}${here ? `<span class="chip chip-ok">${opts.nacional ? "já é Nacional" : "já no evento"}</span>` : ""}</span></label>`;
        }).join("") + (list.length > 300 ? `<p class="small muted" style="padding:var(--sp-sm)">Mostrando 300 de ${list.length}. Use a busca.</p>` : "");
        $$("[data-bp]", el).forEach((c) => c.addEventListener("change", () => {
          if (opts.nacional) chosen.clear();
          c.checked ? chosen.add(c.dataset.bp) : chosen.delete(c.dataset.bp);
          $("#bp-count", el).textContent = chosen.size ? `${chosen.size} pessoa(s) marcada(s)` : "Nenhuma pessoa marcada";
          $("[data-ok]", el).disabled = !chosen.size;
        }));
      };
      draw();
      $("#bp-q", el).addEventListener("input", (e) => { f.q = e.target.value; draw(); });
      $("#bp-uf", el).addEventListener("change", (e) => { f.uf = e.target.value; draw(); });
      $("#bp-int", el).addEventListener("change", (e) => { f.int = e.target.value; draw(); });
      $("#bp-login", el).addEventListener("change", (e) => { f.login = e.target.checked; draw(); });
      bindBaseRefresh(el, () => { base = store.base.volunteers.slice().sort(byName); draw(); });
      $("[data-ok]", el).addEventListener("click", async () => {
        const roles = opts.nacional ? null : $$("[data-brole]", el).filter((c) => c.checked).map((c) => c.dataset.brole);
        if (roles && !roles.length) return toast("Marque pelo menos uma função.", "err");
        const room = opts.nacional ? "" : $("#bp-room", el).value;
        close();
        ui.silent = true;
        for (const id of chosen) {
          const v = base.find((x) => x.id === id);
          const cur = store.get("users", id) || { id, cpf: v.cpf, name: v.name, roles: {}, rooms: {}, active: true, createdAt: nowISO() };
          const rec = { ...cur, name: v.name, cpf: v.cpf, active: true };
          if (opts.nacional) rec.nacional = true;
          else {
            rec.roles = { ...(cur.roles || {}), [ev.id]: ROLE_ORDER.filter((r) => roles.includes(r)) };
            rec.rooms = { ...(cur.rooms || {}), [ev.id]: room };
          }
          try { await store.put("users", rec); } catch (e) { /* aviso já mostrado */ }
        }
        ui.silent = false;
        await store.audit(ev?.id || null, opts.nacional ? "Adicionado à Operação Nacional" : "Voluntários vinculados da base", `${chosen.size} pessoa(s)`);
        render();
        toast(`${chosen.size} pessoa(s) ${opts.nacional ? "adicionada(s)" : "vinculada(s)"}.`);
      });
    },
  });
}

/* adiciona equipes da base ao evento */
function baseTeamsPicker() {
  if (!store.base) return baseNotLoaded();
  const ev = currentEvent();
  let base = store.base.teams.slice().sort(byName);
  const ufs = [...new Set(base.map((t) => t.state).filter(Boolean))].sort();
  const f = { q: "", uf: "" };
  const chosen = new Set();
  const here = new Set(teamsOf(ev.id).map((t) => t.baseId));
  openModal({
    title: "Adicionar equipes da base", icon: "group_add", size: "wide",
    body: `
      <div class="bp-filters">
        <div class="search-box" style="margin:0;flex:1;min-width:200px"><span class="msym">search</span><input type="text" id="bp-q" placeholder="Equipe, código, instituição ou cidade" autocomplete="off"></div>
        <select id="bp-uf"><option value="">Todas as UF</option>${ufs.map((u) => `<option>${esc(u)}</option>`).join("")}</select>
        <button type="button" class="btn btn-text btn-sm" id="bp-all">Marcar as visíveis</button>
        <button type="button" class="btn btn-text btn-sm" id="bp-refresh"><span class="msym sm">sync</span>Atualizar da planilha</button>
      </div>
      <div class="bp-list" id="bp-list"></div>
      <div class="bp-foot"><div class="field"><label for="bp-room">Sala</label><select id="bp-room"><option value="">Sem sala (distribuir depois)</option>${roomsOf(ev.id).map((r) => `<option value="${attr(r.id)}">${esc(r.name)}</option>`).join("")}</select></div></div>`,
    footer: `<span class="small muted" id="bp-count">Nenhuma equipe marcada</span><button class="btn btn-text right" data-close>Cancelar</button>
             <button class="btn btn-fill" data-ok disabled><span class="msym">group_add</span>Adicionar</button>`,
    onMount: (el, close) => {
      let visible = [];
      const upd = () => {
        $("#bp-count", el).textContent = chosen.size ? `${chosen.size} equipe(s) marcada(s)` : "Nenhuma equipe marcada";
        $("[data-ok]", el).disabled = !chosen.size;
      };
      const draw = () => {
        const q = norm(f.q);
        visible = base.filter((t) => (!f.uf || t.state === f.uf) && (!q || [t.name, t.code, t.school, t.city].some((x) => norm(x).includes(q))));
        $("#bp-list", el).innerHTML = !visible.length ? `<p class="small muted" style="padding:var(--sp-md)">Nenhuma equipe com esses filtros.</p>` : visible.map((t) => {
          const clash = !here.has(t.baseId) && regionalConflict(t.key, ev.id);
          const off = here.has(t.baseId) || !!clash;
          return `<label class="bp-row ${off ? "done" : ""}"><input type="checkbox" data-bp="${attr(t.baseId)}" ${chosen.has(t.baseId) ? "checked" : ""} ${off ? "disabled" : ""}>
            <span class="bp-main"><b>${esc(t.name)}</b><span class="small muted">${esc(t.code)} · ${esc(t.school)} · ${esc([t.city, t.state].filter(Boolean).join("/"))}</span></span>
            <span class="bp-meta small">${here.has(t.baseId) ? `<span class="chip chip-ok">já no evento</span>` : clash ? `<span class="chip chip-crit" title="Cada equipe participa de um único regional">no ${esc(clash.name)}</span>` : ""}</span></label>`;
        }).join("");
        $$("[data-bp]", el).forEach((c) => c.addEventListener("change", () => { c.checked ? chosen.add(c.dataset.bp) : chosen.delete(c.dataset.bp); upd(); }));
      };
      draw();
      $("#bp-q", el).addEventListener("input", (e) => { f.q = e.target.value; draw(); });
      $("#bp-uf", el).addEventListener("change", (e) => { f.uf = e.target.value; draw(); });
      bindBaseRefresh(el, () => { base = store.base.teams.slice().sort(byName); draw(); });
      $("#bp-all", el).addEventListener("click", () => { $$("[data-bp]:not(:disabled)", el).forEach((c) => { c.checked = true; chosen.add(c.dataset.bp); }); upd(); });
      $("[data-ok]", el).addEventListener("click", async () => {
        const room = $("#bp-room", el).value;
        close();
        ui.silent = true;
        for (const bid of chosen) {
          const t = base.find((x) => x.baseId === bid);
          try {
            await store.put("teams", { id: "tm-" + norm(bid).replace(/[^a-z0-9]+/g, "") + "-" + ev.id.slice(-6), eventId: ev.id, baseId: t.baseId, code: t.code,
              number: t.code, name: t.name, key: t.key, school: t.school, city: t.city, state: t.state, coach: t.coach, roomId: room, createdAt: nowISO() });
          } catch (e) { /* aviso já mostrado */ }
        }
        ui.silent = false;
        await store.audit(ev.id, "Equipes adicionadas da base", `${chosen.size} equipe(s)`);
        render();
        toast(`${chosen.size} equipe(s) adicionada(s).`);
      });
    },
  });
}

/* ============================================================
   9. ROTEADOR E INICIALIZAÇÃO
   ============================================================ */
function render() {
  if (!store.ready) {
    $("#app").innerHTML = `<div class="auth-wrap"><div class="stack g-sm center"><span class="msym lg" style="color:var(--sys-primary)">sync</span><p class="muted">Carregando…</p></div></div>`;
    return;
  }
  syncUser();
  if (!session.user) return viewLogin();
  viewApp();
}

(function applyTheme() {
  try {
    const t = localStorage.getItem("explore.theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* ignora */ }
})();

async function boot() {
  $("#app-version").textContent = "v" + APP_VERSION;
  render();
  await store.init();
  if (store.backend === "gas" && !ui.pubTeams) {
    ui.pubLoading = true;
    gasCall("publicTeamNames").then((r) => { ui.pubTeams = r; ui.pubLoading = false; if (!session.user && loginKind === "team") viewLogin(); })
      .catch(() => { ui.pubLoading = false; });
  }
  const cached = session.load();
  if (store.backend === "gas") {
    if (cached?.token) {
      try {
        session.token = cached.token;
        await store.gasLoad(cached.token);
        session.user = { id: cached.id, kind: cached.kind, cpf: session.who?.cpf, name: session.who?.name };
        session.eventId = cached.eventId || null;
        session.tab = cached.tab || null;
        try { session.teamIds = JSON.parse(sessionStorage.getItem("explore.teamIds") || "null"); } catch (e) { /* ignora */ }
        syncUser();
      } catch (e) { session.token = null; session.user = null; session.save(); }
    }
  } else await bootstrapNacional();
  if (store.backend !== "gas" && cached?.id) {
    session.user = { id: cached.id, kind: cached.kind };
    session.eventId = cached.eventId || null;
    session.tab = cached.tab || null;
    try { session.teamIds = JSON.parse(sessionStorage.getItem("explore.teamIds") || "null"); } catch (e) { /* ignora */ }
    syncUser();
  }
  store.onChange(() => {
    if (ui.silent || modalStack.length) return;
    if (document.activeElement?.matches("input,textarea,select")) return;
    render();
  });
  window.addEventListener("hashchange", () => {
    ui.flushRubric?.();
    ui.flushRubric = null;
    render();
    if (!/^#\/(equipe|avaliar)\//.test(location.hash) && ui.listScroll) window.scrollTo(0, ui.listScroll);
  });
  window.addEventListener("pagehide", () => ui.flushRubric?.());
  render();
}
boot();
</script>
