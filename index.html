   ============================================================ */
/* ------------------------------------------------------------
   MODO GOOGLE: quando a página é servida pelo Apps Script, o
   servidor lê a base (planilhas) e grava na planilha de saída.
   ------------------------------------------------------------ */
function hasScriptRun() { return typeof google !== "undefined" && !!google.script && !!google.script.run; }
function isGas() { return hasScriptRun() || !!(typeof API_URL !== "undefined" && API_URL); }
async function gasCall(fn, ...args) {
  if (hasScriptRun()) {
    return new Promise((resolve, reject) => {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
    });
  }
  /* página no GitHub: POST simples (text/plain) para o app da Web, sem pré-verificação de CORS */
  let res;
  try { res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ fn, args }), redirect: "follow" }); }
  catch (e) { throw new Error("Sem conexão com o servidor. Confira a internet e o API_URL."); }
  let out;
  try { out = await res.json(); } catch (e) { throw new Error("O servidor respondeu algo inesperado. Confira se o API_URL termina em /exec e se o acesso é 'Qualquer pessoa'."); }
  if (!out.ok) throw new Error(out.error || "Erro no servidor");
  return out.result;
}
function gasError(e) {
  const m = String(e?.message || e);
  if (m.includes("SESSAO_EXPIRADA")) { toast("Sua sessão expirou. Entre de novo.", "err"); logout(); return true; }
  if (m.includes("SEM_PERMISSAO")) { toast("Você não tem permissão para essa alteração.", "err"); store.gasSync(true); return true; }
  toast("Não foi possível salvar na planilha: " + m.slice(0, 120), "err");
  return false;
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) return resolve();
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("falha ao carregar " + src));
    document.head.appendChild(s);
  });
}

/* Inicia o Firebase e devolve um objeto com a mesma forma do banco do Claude,
   para o resto do sistema não precisar saber qual dos dois está em uso. */
async function initFirebase() {
  const V = "10.13.2";
  const base = "https://www.gstatic.com/firebasejs/" + V + "/";
  await loadScript(base + "firebase-app-compat.js");
  await loadScript(base + "firebase-auth-compat.js");
  await loadScript(base + "firebase-firestore-compat.js");
  if (!window.firebase) throw new Error("SDK do Firebase não carregou");
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  /* login anônimo: permite exigir usuário autenticado nas regras do Firestore */
  try { await firebase.auth().signInAnonymously(); } catch (e) { console.warn("login anônimo indisponível", e); }
  return firebase.firestore();
}

const COLLECTIONS = ["users", "events", "teams", "rooms", "evaluations", "settings", "deliberation"];
const LS_KEY = "explore.v2";

const store = {
  mode: "local",
  db: null,
  data: { users: {}, events: {}, teams: {}, rooms: {}, evaluations: {}, settings: {}, deliberation: {}, audit: {} },
  listeners: new Set(),
  ready: false,

  onChange(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  emit() { this.listeners.forEach((f) => { try { f(); } catch (e) { console.error(e); } }); },

  all(col) { return Object.values(this.data[col] || {}); },
  get(col, id) { return id ? this.data[col]?.[id] || null : null; },

  async init() {
    if (isGas()) {
      /* no modo Google os dados só chegam depois do login */
      this.backend = "gas";
      this.mode = "cloud";
      this.ready = true;
      this.emit();
      return;
    }
    this._loadLocal();
    let db = null;

    /* 1. Firebase, quando o arquivo está publicado em hospedagem própria
       e o bloco FIREBASE_CONFIG lá em cima foi preenchido */
    if (typeof FIREBASE_CONFIG !== "undefined" && FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey) {
      try {
        db = await initFirebase();
        if (db) this.backend = "firebase";
      } catch (e) {
        console.warn("Firebase indisponível, usando armazenamento local.", e);
        toast("Não foi possível conectar ao banco. Os dados ficarão apenas neste navegador.", "err");
      }
    }
    /* 2. banco do Claude, quando roda como artifact */
    if (!db && typeof claude !== "undefined") {
      try { db = await claude.use("db"); if (db) this.backend = "claude"; } catch (e) { db = null; }
    }
    /* 3. sem banco: cai para o navegador */
    if (db) {
      this.db = db;
      this.mode = "cloud";
      await this._loadCloud();
    }
    this.ready = true;
    this.emit();
  },
  backend: "local",
  base: null,
  ts: "",
  _poll: null,

  /* modo Google: carrega tudo depois do login e acompanha as mudanças a cada 15 s */
  async gasLoad(token, pre) {
    const r = pre || await gasCall("bootstrap", token);
    COLLECTIONS.forEach((c) => { this.data[c] = (r.data && r.data[c]) || {}; });
    this.base = r.base || null;
    this.ts = r.ts;
    session.who = r.who;
    clearInterval(this._poll);
    this._poll = setInterval(() => { if (!document.hidden) this.gasSync(); }, 20000);
    this.emit();
  },
  async gasSync(force) {
    if (!session.token) return;
    try {
      if (force) return await this.gasLoad(session.token);
      const r = await gasCall("sync", session.token, this.ts || "");
      let changed = false;
      if (r.full) { COLLECTIONS.forEach((c) => { this.data[c] = r.data[c] || {}; }); changed = true; }
      else {
        COLLECTIONS.forEach((c) => Object.entries(r.data[c] || {}).forEach(([id, doc]) => {
          if (JSON.stringify(this.data[c][id]) !== JSON.stringify(doc)) { this.data[c][id] = doc; changed = true; }
        }));
        (r.removed || []).forEach(({ col, id }) => { if (this.data[col]?.[id]) { delete this.data[col][id]; changed = true; } });
      }
      this.ts = r.ts;
      if (changed) this.emit();
    } catch (e) { if (String(e?.message || e).includes("SESSAO_EXPIRADA")) gasError(e); }
  },
  gasStop() { clearInterval(this._poll); this._poll = null; this.base = null; COLLECTIONS.forEach((c) => { this.data[c] = {}; }); },

  _loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        COLLECTIONS.forEach((c) => { this.data[c] = parsed[c] || {}; });
        this.data.audit = parsed.audit || {};
      }
    } catch (e) { console.warn("local storage indisponível", e); }
  },
  _saveLocal() {
    if (this.mode === "cloud") return;
    try { localStorage.setItem(LS_KEY, JSON.stringify(this.data)); } catch (e) { /* cota/privado */ }
  },

  async _loadCloud() {
    await Promise.all(
      COLLECTIONS.map(async (col) => {
        try {
          const snap = await this.db.collection(col).limit(1000).get();
          const map = {};
          snap.docs.forEach((d) => { map[d.id] = { id: d.id, ...d.data() }; });
          this.data[col] = map;
        } catch (e) { console.warn("falha ao carregar", col, e); }
      })
    );
    COLLECTIONS.forEach((col) => {
      try {
        this.db.collection(col).limit(1000).onSnapshot(
          (snap) => {
            const map = {};
            snap.docs.forEach((d) => { map[d.id] = { id: d.id, ...d.data() }; });
            this.data[col] = map;
            this.emit();
          },
          (err) => console.warn("assinatura", col, err.code)
        );
      } catch (e) { console.warn(e); }
    });
  },

  async put(col, obj) {
    if (!obj.id) obj.id = uid(col.slice(0, 2));
    obj.updatedAt = nowISO();
    this.data[col][obj.id] = { ...obj };
    this.emit();
    if (this.backend === "gas") {
      try { await gasCall("put", session.token, col, obj); } catch (e) { gasError(e); throw e; }
      return obj;
    }
    if (this.mode === "cloud") {
      const { id, ...body } = obj;
      try { await this.db.doc(`${col}/${id}`).set(body); }
      catch (e) { toast("Não foi possível salvar no banco: " + (e.code || "erro"), "err"); throw e; }
    } else this._saveLocal();
    return obj;
  },

  async remove(col, id) {
    delete this.data[col][id];
    this.emit();
    if (this.backend === "gas") {
      try { await gasCall("remove", session.token, col, id); } catch (e) { gasError(e); }
      return;
    }
    if (this.mode === "cloud") {
      try { await this.db.doc(`${col}/${id}`).delete(); } catch (e) { toast("Falha ao excluir", "err"); }
    } else this._saveLocal();
  },

  /* auditoria: um documento por evento com lista de entradas (evita estourar o limite de documentos) */
  async audit(eventId, action, detail) {
    const key = eventId || "_global";
    const entry = {
      at: nowISO(),
      by: session.user ? session.user.name : "sistema",
      byId: session.user ? session.user.id : null,
      role: ROLE_LABEL[roleOf(session.user)] || "—",
      action,
      detail: detail || "",
    };
    if (this.backend === "gas") { if (session.token) gasCall("audit", session.token, eventId || "", entry).catch(() => {}); return; }
    const cur = this.data.audit[key] || { id: key, entries: [] };
    cur.entries = [entry, ...(cur.entries || [])].slice(0, 700);
    this.data.audit[key] = cur;
    if (this.mode === "cloud") {
      try { await this.db.doc(`audit/${key}`).set({ entries: cur.entries }); } catch (e) { /* não bloqueia a operação */ }
    } else this._saveLocal();
  },
  async removeAudit(eventId) {
    const key = eventId || "_global";
    delete this.data.audit[key];
    if (this.mode === "cloud") {
      try { await this.db.doc(`audit/${key}`).delete(); } catch (e) { /* já pode não existir */ }
    } else this._saveLocal();
  },
  async loadAudit(eventId) {
    const key = eventId || "_global";
    if (this.mode === "cloud") {
      try {
        const d = await this.db.doc(`audit/${key}`).get();
        this.data.audit[key] = { id: key, entries: d.exists ? d.data().entries || [] : [] };
      } catch (e) { /* mantém o que houver em memória */ }
    }
    return this.data.audit[key]?.entries || [];
  },
};

/* ============================================================
   5. SESSÃO E AUTENTICAÇÃO
   ============================================================ */
const session = {
  user: null,          // registro do banco + kind: "vol" | "team"
  eventId: null,
  tab: null,
  load() {
    try { return JSON.parse(sessionStorage.getItem("explore.session") || "null"); } catch (e) { return null; }
  },
  save() {
    try {
      sessionStorage.setItem("explore.session", JSON.stringify(this.user
        ? { kind: this.user.kind, id: this.user.id, eventId: this.eventId, tab: this.tab, token: this.token || null } : null));
    } catch (e) { /* ignora */ }
  },
};
/* mantém o usuário da sessão igual ao banco (papéis mudam enquanto a pessoa usa) */
function syncUser() {
  const u = session.user;
  if (!u) return;
  if (store.backend === "gas" && u.kind === "vol") {
    /* a pessoa vem da base; o documento "users" só guarda funções e salas */
    const fresh = store.get("users", u.id);
    const w = session.who || {};
    session.user = { id: u.id, cpf: w.cpf || u.cpf, name: w.name || u.name, roles: {}, rooms: {}, ...(fresh || {}), nacional: !!(w.nacional || fresh?.nacional), kind: "vol" };
    return;
  }
  const fresh = store.get(u.kind === "team" ? "teams" : "users", u.id);
  session.user = fresh && (u.kind === "team" || fresh.active !== false) ? { ...fresh, kind: u.kind } : null;
}

  const u = session.user;
  return u && u.kind === "vol" ? u.roles?.[evId] || [] : [];
}
const can = {
  nac: () => session.user?.kind === "vol" && !!session.user.nacional,
  people: () => can.nac() || myRoles().includes("regional"),
  evalOrg: () => can.nac() || myRoles().includes("lider"),
  judge: () => myRoles().includes("avaliador"),
};
function roleOf(u) {
  if (!u) return null;
  if (u.kind === "team") return "team";
  if (u.nacional) return "nac";
  return ROLE_ORDER.find((r) => (u.roles?.[session.eventId] || []).includes(r)) || "avaliador";
}
/* eventos em que a pessoa atua (Nacional vê todos) */
function myEvents() {
  const all = store.all("events").sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const u = session.user;
  if (!u) return [];
  if (u.kind === "team") return all.filter((e) => (session.teamIds || [u.id]).some((id) => store.get("teams", id)?.eventId === e.id));
  if (u.nacional) return all;
  return all.filter((e) => (u.roles?.[e.id] || []).length);
}

async function doLogin(kind, login, pw) {
  if (store.backend === "gas") {
    let r;
    try { r = await gasCall("login", kind, login, pw || ""); } catch (e) { return { ok: false, msg: "Não foi possível falar com o servidor. Tente de novo." }; }
    if (!r.ok) return r;
    session.token = r.token;
    session.who = r.who;
    try { await store.gasLoad(r.token, r.boot); } catch (e) { return { ok: false, msg: "Erro ao carregar os dados: " + String(e?.message || e).slice(0, 100) }; }
    if (kind === "vol") {
      session.user = { id: r.who.id, cpf: r.who.cpf, name: r.who.name, kind: "vol" };
      syncUser();
      session.eventId = null; session.tab = null;
      const evs = myEvents();
      if (evs.length === 1 && !session.user.nacional) session.eventId = evs[0].id;
    } else {
      const hits = store.all("teams").filter((t) => t.baseId === r.who.baseId);
      if (!hits.length) { session.token = null; store.gasStop(); return { ok: false, msg: "A equipe ainda não foi colocada em nenhum evento. Procure a organização." }; }
      session.teamIds = hits.map((t) => t.id);
      session.user = { ...hits[0], kind: "team" };
      session.eventId = hits.length === 1 ? hits[0].eventId : null;
    }
    session.save();
    try { sessionStorage.setItem("explore.teamIds", JSON.stringify(session.teamIds || [])); } catch (e) { /* ignora */ }
    return { ok: true };
  }
  if (kind === "vol") {
    const cpf = onlyDigits(login);
    if (cpf.length !== 11) return { ok: false, msg: "Digite os 11 números do CPF." };
    const u = store.get("users", "vol-" + cpf);
    if (!u || !(await checkPw(u, pw))) return { ok: false, msg: "CPF ou senha incorretos." };
    if (u.active === false) return { ok: false, msg: "Este acesso está desativado. Procure a organização do evento." };
    session.user = { ...u, kind: "vol" };
    session.eventId = null;
    session.tab = null;
    const evs = myEvents();
    if (evs.length === 1 && !u.nacional) session.eventId = evs[0].id;
  } else {
    const key = norm(login);
    if (!key) return { ok: false, msg: "Digite o nome da equipe." };
    const hits = [];
    for (const t of store.all("teams").filter((x) => x.key === key)) if (await checkPw(t, pw)) hits.push(t);
    if (!hits.length) return { ok: false, msg: "Nome da equipe ou senha incorretos." };
    session.teamIds = hits.map((t) => t.id);
    session.user = { ...hits[0], kind: "team" };
    session.eventId = hits.length === 1 ? hits[0].eventId : null;
  }
  session.save();
  try { sessionStorage.setItem("explore.teamIds", JSON.stringify(session.teamIds || [])); } catch (e) { /* ignora */ }
  await store.audit(session.eventId, "Login", session.user.kind === "vol" ? fmtCPF(session.user.cpf) : session.user.name);
  return { ok: true };
}
function logout() {
  if (store.backend === "gas") { store.gasStop(); session.token = null; session.who = null; }
  session.user = null;
  session.eventId = null;
  session.tab = null;
  session.teamIds = null;
  session.save();
  if (location.hash) history.replaceState(null, "", location.pathname);
  render();
}

let modalStack = [];
function openModal({ title, icon, body, footer, size, onMount, dismissable = true }) {
  const back = document.createElement("div");
  back.className = "modal-back";
  back.innerHTML = `
    <div class="modal ${size || ""}" role="dialog" aria-modal="true" aria-label="${attr(title)}">
      <header>
        ${icon ? `<span class="msym">${icon}</span>` : ""}
        <h3>${esc(title)}</h3>
        ${dismissable ? `<button class="icon-btn" data-close aria-label="Fechar"><span class="msym">close</span></button>` : ""}
      </header>
      <div class="modal-body">${body}</div>
      ${footer ? `<footer>${footer}</footer>` : ""}
    </div>`;
  $("#modals").appendChild(back);
  modalStack.push(back);
  const close = () => {
    back.remove();
    modalStack = modalStack.filter((m) => m !== back);
  };
  $$("[data-close]", back).forEach((b) => b.addEventListener("click", close));
  if (dismissable) {
    back.addEventListener("mousedown", (e) => { if (e.target === back) close(); });
  }
  const esckey = (e) => { if (e.key === "Escape" && dismissable && modalStack[modalStack.length - 1] === back) { close(); document.removeEventListener("keydown", esckey); } };
  document.addEventListener("keydown", esckey);
  if (onMount) onMount(back, close);
  const first = back.querySelector("input,select,textarea,button:not([data-close])");
  if (first) setTimeout(() => first.focus(), 40);
  return { el: back, close };
}
function confirmModal(title, message, okLabel, danger) {
  return new Promise((resolve) => {
    openModal({
      title, icon: danger ? "warning" : "help",
      body: `<p>${message}</p>`,
      footer: `<button class="btn btn-text" data-close>Cancelar</button>
               <button class="btn ${danger ? "btn-danger" : "btn-fill"}" data-ok>${esc(okLabel || "Confirmar")}</button>`,
      onMount: (el, close) => {
        $("[data-ok]", el).addEventListener("click", () => { close(); resolve(true); });
        $$("[data-close]", el).forEach((b) => b.addEventListener("click", () => resolve(false)));
        el.addEventListener("mousedown", (e) => { if (e.target === el) resolve(false); });
      },
    });
  });
}

/* confirmação que exige a senha de quem está logado */
function confirmWithPassword(title, message, okLabel) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    openModal({
      title, icon: "lock",
      body: `<p style="margin-bottom:var(--sp-md)">${message}</p>
        <div class="field"><label for="cf-pw">Confirme com a sua senha</label>
          <input type="password" id="cf-pw" autocomplete="current-password"></div>
        <div id="cf-err" class="banner crit small" hidden style="margin-top:var(--sp-sm)"><span class="msym">error</span><span>Senha incorreta.</span></div>`,
      footer: `<button class="btn btn-text" data-close>Cancelar</button><button class="btn btn-fill" data-ok><span class="msym">lock_open</span>${esc(okLabel)}</button>`,
      onMount: (el, close) => {
        const go = async () => {
          const ok = store.backend === "gas" ? await gasCall("verifyPassword", session.token, $("#cf-pw", el).value).catch(() => false)
            : await checkPw(store.get("users", session.user?.id), $("#cf-pw", el).value);
          if (!ok) {
            $("#cf-err", el).hidden = false;
            $("#cf-pw", el).select();
            return;
          }
          close(); finish(true);
        };
        $("[data-ok]", el).addEventListener("click", go);
        $("#cf-pw", el).addEventListener("keydown", (ev) => { if (ev.key === "Enter") go(); });
        $$("[data-close]", el).forEach((b) => b.addEventListener("click", () => finish(false)));
        el.addEventListener("mousedown", (ev) => { if (ev.target === el) finish(false); });
      },
    });
  });
}

/* Campo de equipe: lista em ordem alfabética que filtra enquanto digita.
   Busca sem acento e por qualquer parte do nome ou pelo número. */
function bindTeamCombo(input, onPick) {
  const list = $("#team-list");
  const seen = new Set();
  const teams = (store.backend === "gas" ? (ui.pubTeams?.teams || []) : store.all("teams")).filter((t) => (seen.has(t.key) ? false : seen.add(t.key)))
    .sort((a, b) => a.name.localeCompare(b.name, "pt-BR", { sensitivity: "base" }));
  let items = [], active = -1;
  const open = (on) => { list.hidden = !on; input.setAttribute("aria-expanded", on); };
  function draw() {
    const q = norm(input.value);
    items = q ? teams.filter((t) => t.key.includes(q) || norm(t.number) === q) : teams;
    active = items.length ? Math.max(0, Math.min(active, items.length - 1)) : -1;
    list.innerHTML = items.length
      ? items.map((t, i) => `<li role="option" id="tm-${i}" data-i="${i}" aria-selected="${i === active}">
          <span class="nm">${esc(t.name)}</span>
          ${t.number || t.city ? `<span class="meta">${esc([t.number && "nº " + t.number, t.city].filter(Boolean).join(" · "))}</span>` : ""}
        </li>`).join("")
      : `<li class="empty">Nenhuma equipe encontrada</li>`;
    input.setAttribute("aria-activedescendant", active >= 0 ? "tm-" + active : "");
    list.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: "nearest" });
    open(true);
  }
  function choose(i) {
    const t = items[i];
    if (!t) return;
    input.value = t.name;
    open(false);
    onPick && onPick(t);
  }
  input.addEventListener("focus", () => { active = -1; draw(); });
  input.addEventListener("click", () => { if (list.hidden) draw(); });
  input.addEventListener("input", () => { active = 0; draw(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); if (list.hidden) return draw(); active = Math.min(active + 1, items.length - 1); draw(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(active - 1, 0); draw(); }
    else if (e.key === "Enter" && !list.hidden && active >= 0) { e.preventDefault(); choose(active); }
    else if (e.key === "Escape") open(false);
    else if (e.key === "Tab" && !list.hidden && active >= 0 && input.value.trim()) choose(active);
  });
  /* mousedown para escolher antes do blur fechar a lista */
  list.addEventListener("mousedown", (e) => {
    const li = e.target.closest("[data-i]");
    e.preventDefault();
    if (li) choose(+li.dataset.i);
  });
  input.addEventListener("blur", () => setTimeout(() => open(false), 120));
}

  refreshAccess();

    $("#app").innerHTML = `${shellBar()}<div class="main page" id="tab-root"></div>`;
    bindShellBar();
    return renderTeamHome($("#tab-root"));
  }
  const tabs = navTabs();
  if (!tabs.length) {
    session.eventId = null;
    return viewEventPicker();
  }
  /* rotas: #/avaliar/<equipe> (rubrica) e #/equipe/<equipe> (detalhe da organização) */
  const mR = location.hash.match(/^#\/avaliar\/(.+)$/);
  const mE = location.hash.match(/^#\/equipe\/(.+)$/);
  const find = (m) => m && ACCESS.teams.find((t) => t.id === decodeURIComponent(m[1]));
  let tab = session.tab;
  if (mR && can.judge()) tab = "avaliar";
  if (mE && can.evalOrg() && tab !== "delib") tab = "painel";
  if (!tabs.some((x) => x.id === tab)) tab = tabs[0].id;
  session.tab = tab;
  session.save();

  $("#app").innerHTML = `
    ${shellBar()}
    <div class="shell">
      ${tabs.length > 1 ? `<nav class="rail no-print" aria-label="Seções do evento">
        ${tabs.map((x) => `<button class="rail-item" data-tab="${x.id}" ${x.id === tab ? 'aria-current="page"' : ""}>
          <span class="msym">${x.icon}</span><span>${x.label}</span></button>`).join("")}
      </nav>` : ""}
      <div class="main"><div class="page" id="tab-root"></div></div>
    </div>`;
  bindShellBar();
  $$("[data-tab]").forEach((b) => b.addEventListener("click", () => {
    session.tab = b.dataset.tab; session.save();
    ui.flushRubric?.(); ui.flushRubric = null;
    if (location.hash) history.replaceState(null, "", location.pathname);
    render();
    window.scrollTo(0, 0);
  }));
  const root = $("#tab-root");
  if (tab === "avaliar") { const t = find(mR); return t && judgeSees(t) ? renderRubric(root, t) : renderJudgeHome(root); }
  if (tab === "painel") { const t = find(mE); return t ? renderOrgTeam(root, t) : renderOrgHome(root); }
  if (tab === "delib") { const t = find(mE); return t ? renderOrgTeam(root, t) : renderDelib(root); }
  if (tab === "nivel") return renderNivel(root);
  if (tab === "voluntarios") return renderPeople(root);
  if (tab === "equipes") return renderTeamsAdmin(root);
  if (tab === "salas") return renderRooms(root);
}

/* ============================================================
   8.1 AVALIAÇÕES — consultas
   Uma avaliação por par equipe × avaliador:
   { id, teamId, judgeId, judgeName, scores:{cs1..tp2: 1-4}, recommend: true|false|null,
     excede:{critId: justificativa}, comments, orgComments, status: draft|sent|reopened,
     firstSentAt, sentAt,
     orgNote, orgNoteAt            — observação da organização para o avaliador
     orgEditedAt, original{comments, excede} — texto corrigido pela organização (guarda o original) }
   ============================================================ */
const evalId = (teamId, judgeId) => `${teamId}__${judgeId}`;
function myEval(teamId) { return store.get("evaluations", evalId(teamId, session.user.id)); }
function evalsOfTeam(teamId) { return store.all("evaluations").filter((e) => e.teamId === teamId); }
function filledCount(e) { return e ? ALL_CRITS.filter((c) => e.scores?.[c.id]).length : 0; }
/* Número da avaliação: ordem do primeiro envio (AV-001, AV-002…).
   Não muda quando a avaliação é reaberta e reenviada. */
function evalNumbers() {
  const list = evalsOfEvent().filter((e) => e.firstSentAt || e.sentAt)
    .sort((a, b) => (a.firstSentAt || a.sentAt).localeCompare(b.firstSentAt || b.sentAt) || a.id.localeCompare(b.id));
  const map = {};
  list.forEach((e, i) => { map[e.id] = "AV-" + String(i + 1).padStart(3, "0"); });
  return map;
}
function evalNo(e) { return e ? evalNumbers()[e.id] || "" : ""; }
function evalStatus(e) { return e ? e.status || "draft" : "pending"; }
function canEdit(e) { const st = evalStatus(e); return st === "pending" || st === "draft" || st === "reopened"; }
function evalChip(st) {
  const map = {
    pending: ["chip-out", "hourglass_empty", "Não iniciada"],
    draft: ["chip-warn", "edit_note", "Rascunho"],
    reopened: ["chip-crit", "lock_open", "Reaberta"],
    sent: ["chip-ok", "task_alt", "Enviada"],
  };
  const [cls, ic, tx] = map[st] || map.pending;
  return `<span class="chip ${cls}"><span class="msym">${ic}</span>${tx}</span>`;
}
function emptyBox(icon, title, sub) {
  return `<div class="empty"><span class="msym">${icon}</span><h3>${esc(title)}</h3><p class="small muted">${esc(sub || "")}</p></div>`;
}
function eventEyebrow() {
  const ev = currentEvent();
  return ev ? [ev.name, ev.date && fmtDate(ev.date)].filter(Boolean).map(esc).join(" · ").replace(/\bFIRST\b/g, "<i>FIRST</i>") : "";
}
const byName = (a, b) => a.name.localeCompare(b.name, "pt-BR", { sensitivity: "base" });

/* ============================================================
   8.2 AVALIADOR — lista de equipes
   ============================================================ */
const ui = { filter: "todas", q: "", silent: false, listScroll: 0, flushRubric: null, orgTab: "equipes", orgFilter: "todas", orgQ: "", teamEval: 0, orgSort: {}, peopleQ: "", teamsQ: "", delibTab: "class", delibSort: { key: "rank", dir: -1 } };

/* avaliador vê só a própria sala; Líder de Avaliação e Nacional veem todas */
function judgeSees(t) { return can.evalOrg() || (!!judgeRoomId(session.user) && t.roomId === judgeRoomId(session.user)); }
function renderJudgeHome(root) {
  const myRoom = judgeRoomId(session.user);
  if (!can.evalOrg() && !myRoom) {
    root.innerHTML = `<div class="page-head"><div class="grow"><div class="eyebrow">${eventEyebrow()}</div><h1>Olá, ${esc(session.user.name.split(/\s+/)[0])}</h1></div></div>
      <div class="card">${emptyBox("meeting_room", "Você ainda não está em uma sala", "Assim que a organização colocar você em uma sala, as equipes dela aparecem aqui.")}</div>`;
    return;
  }
  const rows = ACCESS.teams.filter(judgeSees).sort(byName).map((t) => {
    const e = myEval(t.id);
    return { t, e, st: evalStatus(e), others: evalsOfTeam(t.id).filter((x) => x.judgeId !== session.user.id && x.status === "sent").length };
  });
  const count = (fn) => rows.filter(fn).length;
  const nSent = count((r) => r.st === "sent");
  const nDraft = count((r) => r.st === "draft" || r.st === "reopened");
  const nPend = count((r) => r.st === "pending");
  const first = session.user.name.split(/\s+/)[0];

  root.innerHTML = `
    <div class="page-head">
      <div class="grow">
        <div class="eyebrow">${eventEyebrow()}</div>
        <h1>Olá, ${esc(first)}</h1>
        <p class="muted small">${myRoom ? `<span class="chip chip-prim" style="margin-right:6px"><span class="msym">meeting_room</span>${esc(roomName(myRoom))}</span>` : ""}${can.evalOrg() ? "Como Líder de Avaliação, você vê as equipes de todas as salas." : "Escolha a equipe que está na sua sala para abrir a Rubrica de Avaliação."}</p>
      </div>
    </div>

    <div class="kpi-grid kpi-4" style="margin-bottom:var(--sp-lg)">
      <div class="kpi"><span class="k">Equipes</span><span class="v">${rows.length}</span><span class="sub">${can.evalOrg() ? "no evento" : "na sua sala"}</span></div>
      <div class="kpi good"><span class="k">Enviadas</span><span class="v">${nSent}</span><span class="sub">por você</span></div>
      <div class="kpi ${nDraft ? "warn" : ""}"><span class="k">Rascunhos</span><span class="v">${nDraft}</span><span class="sub">começadas, não enviadas</span></div>
      <div class="kpi"><span class="k">Não iniciadas</span><span class="v">${nPend}</span><span class="sub">sem avaliação sua</span></div>
    </div>

    <div class="card">
      <div class="sec-title list-head">
        <h2>Equipes</h2>
        <span class="chip chip-out" id="shown-count"></span>
        <div class="right seg filter-seg" role="group" aria-label="Filtrar equipes">
          ${[["todas", "Todas"], ["abertas", "A avaliar"], ["rascunho", "Rascunho"], ["enviadas", "Enviadas"]]
            .map(([k, l]) => `<button data-f="${k}" aria-pressed="${ui.filter === k}">${l}</button>`).join("")}
        </div>
      </div>
      <div class="search-box">
        <span class="msym">search</span>
        <input type="text" id="team-q" placeholder="Buscar equipe, número, escola ou cidade" value="${attr(ui.q)}" autocomplete="off">
      </div>
      <div id="team-rows"></div>
    </div>`;

  const draw = () => {
    const q = norm(ui.q);
    const shown = rows.filter(({ t, st }) => {
      if (ui.filter === "abertas" && st === "sent") return false;
      if (ui.filter === "rascunho" && !(st === "draft" || st === "reopened")) return false;
      if (ui.filter === "enviadas" && st !== "sent") return false;
      if (!q) return true;
      return [t.name, t.number, t.school, t.city].some((x) => norm(x).includes(q));
    });
    $("#shown-count").textContent = `${shown.length} de ${rows.length}`;
    $("#team-rows").innerHTML = shown.length === 0
      ? emptyBox(rows.length ? "search_off" : "groups", rows.length ? "Nenhuma equipe aqui" : "Nenhuma equipe cadastrada",
          rows.length ? "Troque o filtro ou a busca." : "A organização precisa colar a lista de equipes no sistema.")
      : `<ul class="team-list">${shown.map(({ t, e, st, others }) => {
          const n = filledCount(e);
          const edit = canEdit(e);
          const act = st === "pending" ? ["play_arrow", "Avaliar", "btn-fill"]
            : edit ? ["edit", "Continuar", "btn-tonal"] : ["visibility", "Ver", "btn-out"];
          return `<li class="team-row" data-open="${attr(t.id)}" tabindex="0" role="button" aria-label="${attr(act[1] + " " + t.name)}">
            <span class="tnum mono">${esc(t.number || "—")}</span>
            <div class="tinfo">
              <b>${esc(t.name)}</b>
              <span class="small muted">${esc([t.school, t.city].filter(Boolean).join(" · ") || " ")}</span>
            </div>
            <div class="tprog">
              <div class="progress" aria-hidden="true"><i style="width:${(n / ALL_CRITS.length) * 100}%"></i></div>
              <span class="small muted mono">${n}/${ALL_CRITS.length}<span class="hide-sm"> critérios</span></span>
            </div>
            <div class="tstat">
              ${evalChip(st)}
              ${e?.orgNote ? `<span class="chip chip-warn" title="${attr(e.orgNote)}"><span class="msym">forum</span>Observação</span>` : ""}
              ${others ? `<span class="small muted" title="Avaliações enviadas por outros avaliadores">+${others} avaliador${others > 1 ? "es" : ""}</span>` : ""}
            </div>
            <span class="btn ${act[2]} btn-sm tact"><span class="msym">${act[0]}</span>${act[1]}</span>
          </li>`;
        }).join("")}</ul>`;
    $$("[data-open]").forEach((li) => {
      const go = () => openRubric(li.dataset.open);
      li.addEventListener("click", go);
      li.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } });
    });
  };
  draw();
  $$("[data-f]").forEach((b) => b.addEventListener("click", () => {
    ui.filter = b.dataset.f;
    $$("[data-f]").forEach((x) => x.setAttribute("aria-pressed", x === b));
    draw();
  }));
  $("#team-q").addEventListener("input", (ev) => { ui.q = ev.target.value; draw(); });
}

function openRubric(teamId) {
  ui.listScroll = window.scrollY;
  ui.cameFromList = true;
  location.hash = "#/avaliar/" + encodeURIComponent(teamId);
}
function openTeamDetail(teamId) {
  ui.listScroll = window.scrollY;
  ui.cameFromList = true;
  location.hash = "#/equipe/" + encodeURIComponent(teamId);
}
function backToList() {
  /* volta no histórico quando veio da lista, para o "voltar" do celular não reabrir a rubrica */
  if (ui.cameFromList) { ui.cameFromList = false; history.back(); }
  else location.hash = "#/";
}

/* ============================================================
   8.3 AVALIADOR — Rubrica de Avaliação
   Salva sozinha a cada alteração (rascunho). Enviar trava a edição;
   só a organização reabre.
   ============================================================ */
const REQUIRED_TEXT_MIN = 1;

function missingItems(e) {
  const out = [];
  const n = filledCount(e);
  if (n < ALL_CRITS.length) out.push(`${ALL_CRITS.length - n} critério(s) da rubrica`);
  const noJust = excedeMissing(e).length;
  if (noJust) out.push(`${noJust} justificativa(s) de Excede`);
  if (e?.recommend !== true && e?.recommend !== false) out.push("a indicação para a próxima etapa");
  if (!String(e?.comments || "").trim()) out.push("os comentários para a equipe");
  return out;
}
/* nível Excede exige justificativa escrita no próprio critério */
function excedeMissing(e) {
  return ALL_CRITS.filter((c) => e?.scores?.[c.id] === 4 && !String(e?.excede?.[c.id] || "").trim());
}

function renderRubric(root, team) {
  const saved = myEval(team.id);
  /* rascunho em memória: só vira registro no banco na primeira alteração */
  const e = saved ? JSON.parse(JSON.stringify(saved)) : {
    id: evalId(team.id, session.user.id), teamId: team.id, eventId: session.eventId, judgeId: session.user.id,
    scores: {}, excede: {}, recommend: null, comments: "", orgComments: "", status: "draft",
  };
  e.scores = e.scores || {};
  e.excede = e.excede || {};
  const st = evalStatus(saved);
  const ro = !canEdit(saved);
  const dis = ro ? "disabled" : "";
  const meta = [team.number && `nº ${team.number}`, team.school, team.city].filter(Boolean).map(esc).join(" · ");

  root.innerHTML = `
    <div class="rub-page">
      <button class="btn btn-text btn-sm back-btn" id="rb-back"><span class="msym">arrow_back</span>Equipes</button>

      <div class="page-head" style="margin-bottom:var(--sp-md)">
        <div class="grow">
          <div class="eyebrow">Rubrica de Avaliação</div>
          <h1>${esc(team.name)}</h1>
          <p class="muted small">${meta || "&nbsp;"}</p>
        </div>
        <div class="stack g-4xs" style="align-items:flex-end">
          ${evalChip(st)}
          <span class="small muted" id="rb-saved">${saved?.updatedAt ? "Salvo " + fmtDT(saved.updatedAt) : ""}</span>
        </div>
      </div>

      ${ro ? `<div class="banner ok" style="margin-bottom:var(--sp-md)"><span class="msym">task_alt</span>
        <div>Avaliação <b>${evalNo(saved)}</b> enviada ${saved.sentAt ? "em " + fmtDT(saved.sentAt) : ""}. Para alterar, peça à organização para reabrir.</div></div>` : ""}
      ${st === "reopened" ? `<div class="banner crit" style="margin-bottom:var(--sp-md)"><span class="msym">lock_open</span>
        <div>A organização reabriu esta avaliação. Revise e envie de novo.</div></div>` : ""}
      ${saved?.orgNote ? `<div class="banner warn org-msg" style="margin-bottom:var(--sp-md)"><span class="msym">forum</span>
        <div><b>Observação da organização</b> <span class="small">· ${fmtDT(saved.orgNoteAt)}</span><p class="txt">${esc(saved.orgNote)}</p></div></div>` : ""}
      ${saved?.orgEditedAt ? `<div class="banner info small" style="margin-bottom:var(--sp-md)"><span class="msym">edit</span>
        <div>A organização corrigiu o texto desta avaliação em ${fmtDT(saved.orgEditedAt)}.</div></div>` : ""}

      <details class="card flat levels-help" ${saved ? "" : "open"}>
        <summary><span class="msym">info</span><b>Critérios de avaliação</b><span class="small muted">— marque um nível em cada linha</span><span class="msym right chev">expand_more</span></summary>
        <dl class="levels-dl">
          ${LEVELS.map((l) => `<div><dt><span class="lvl-dot l${l.v}"></span>${l.label}</dt><dd>${esc(l.desc)}</dd></div>`).join("")}
        </dl>
      </details>

      ${RUBRIC.map((sec) => `
        <section class="rub-sec" aria-labelledby="sec-${sec.id}">
          <h2 class="rub-bar" id="sec-${sec.id}"><span class="msym">${sec.icon}</span>${esc(sec.title)}</h2>
          ${sec.crits.map((c) => `
            <div class="crit" data-crit="${c.id}">
              <div class="crit-txt">
                <div class="crit-q">${esc(c.q)}</div>
                <div class="crit-d">${esc(c.d)}</div>
              </div>
              <div class="lvl-group" role="radiogroup" aria-label="${attr(c.q)}">
                ${LEVELS.map((l) => `<button type="button" class="lvl l${l.v}" role="radio" data-c="${c.id}" data-v="${l.v}"
                  aria-checked="${e.scores[c.id] === l.v}" ${dis}>${l.label}</button>`).join("")}
              </div>
              <div class="exc-note" data-exc-wrap="${c.id}" ${e.scores[c.id] === 4 ? "" : "hidden"}>
                <label for="exc-${c.id}"><span class="msym sm">star</span>Por que a equipe excedeu neste critério? <span class="req">*</span></label>
                <span class="hint">A equipe lê este texto como feedback na devolutiva.</span>
                <textarea id="exc-${c.id}" data-exc="${c.id}" rows="2" ${dis} placeholder="Descreva o que a equipe fez além do esperado">${esc(e.excede[c.id] || "")}</textarea>
              </div>
            </div>`).join("")}
        </section>`).join("")}

      <section class="rub-sec">
        <h2 class="rub-bar final"><span class="msym">rate_review</span>Parecer do avaliador</h2>
        <div class="final-grid">
          <aside class="sum-box" aria-label="Resumo das notas">
            <div class="sum-head"><span class="msym sm">checklist</span>Resumo das notas</div>
            <div id="rb-summary"></div>
          </aside>
          <div class="final-body stack g-lg">
            <div class="field">
              <label>Indico para a próxima etapa? <span class="req">*</span></label>
              <div class="yn-group" role="radiogroup" aria-label="Indico para a próxima etapa">
                <button type="button" class="yn yes" role="radio" data-rec="1" aria-checked="${e.recommend === true}" ${dis}><span class="msym">thumb_up</span>Sim</button>
                <button type="button" class="yn no" role="radio" data-rec="0" aria-checked="${e.recommend === false}" ${dis}><span class="msym">thumb_down</span>Não</button>
              </div>
            </div>
            <div class="field">
              <label for="rb-com">Comentários <span class="req">*</span></label>
              <span class="hint"><span class="msym sm" style="vertical-align:-3px">visibility</span> A equipe vai ler. Destaque o que foi bem e o que pode melhorar.</span>
              <textarea id="rb-com" rows="7" ${dis} placeholder="Ex.: A equipe explicou com clareza como o sensor aciona o motor…">${esc(e.comments)}</textarea>
            </div>
            <div class="field">
              <label for="rb-org">Comentários para a organização</label>
              <span class="hint"><span class="msym sm" style="vertical-align:-3px">visibility_off</span> Só a organização vê. A equipe não tem acesso.</span>
              <textarea id="rb-org" rows="3" ${dis} placeholder="Opcional">${esc(e.orgComments)}</textarea>
            </div>
          </div>
        </div>
      </section>

      <div class="rub-foot no-print">
        <div class="grow stack g-4xs">
          <div class="row g-2xs"><b class="mono" id="rb-count"></b><span class="small muted" id="rb-miss"></span></div>
          <div class="progress"><i id="rb-prog"></i></div>
        </div>
        ${ro ? `<button class="btn btn-out" id="rb-back2"><span class="msym">arrow_back</span>Voltar</button>`
             : `<button class="btn btn-fill" id="rb-send"><span class="msym">send</span>Enviar avaliação</button>`}
      </div>
    </div>`;

  /* ---------- estado e gravação ---------- */
  let timer = null;
  const persist = async () => {
    clearTimeout(timer);
    timer = null;
    const cur = myEval(team.id);
    if (cur && !canEdit(cur)) return;                  /* travada em outro aparelho */
    if (!e.createdAt) e.createdAt = cur?.createdAt || nowISO();
    const body = { ...e, judgeName: session.user.name, teamName: team.name, status: cur?.status === "reopened" ? "reopened" : "draft" };
    ui.silent = true;
    const p = store.put("evaluations", body);
    ui.silent = false;
    try { await p; $("#rb-saved") && ($("#rb-saved").textContent = "Salvo " + fmtDT(nowISO())); } catch (err) { /* toast já avisou */ }
  };
  const schedule = (ms) => {
    if (ro) return;
    $("#rb-saved").textContent = "Salvando…";
    clearTimeout(timer);
    timer = setTimeout(persist, store.backend === "gas" ? Math.max(ms ?? 700, 1500) : ms ?? 700);
    refreshFoot();
  };
  ui.flushRubric = () => { if (timer) persist(); };

  function refreshFoot() {
    const n = filledCount(e);
    $("#rb-count").textContent = `${n}/${ALL_CRITS.length}`;
    $("#rb-prog").style.width = (n / ALL_CRITS.length) * 100 + "%";
    const miss = missingItems(e);
    $("#rb-miss").textContent = ro ? "critérios marcados" : miss.length ? "Falta: " + miss.join(", ") : "Tudo preenchido. Pode enviar.";
    $$(".crit").forEach((el) => el.classList.toggle("done", !!e.scores[el.dataset.crit]));
    drawSummary();
  }
  function drawSummary() {
    const lv = (v) => LEVELS.find((l) => l.v === v);
    $("#rb-summary").innerHTML = RUBRIC.map((sec) => `
      <div class="sum-sec">
        <div class="sum-title">${esc(sec.title)}</div>
        <ul>${sec.crits.map((c) => {
          const v = e.scores[c.id];
          const note = v === 4 ? String(e.excede[c.id] || "").trim() : "";
          return `<li data-goto="${c.id}" title="Ir para o critério">
            <span class="sum-name">${esc(c.short)}</span>
            ${v ? `<span class="sum-v l${v}" title="${attr(lv(v).label)}">${v}</span>` : `<span class="sum-v none">–</span>`}
            ${v === 4 ? `<span class="sum-note ${note ? "" : "miss"}">${note ? esc(note) : "falta a justificativa"}</span>` : ""}
          </li>`;
        }).join("")}</ul>
      </div>`).join("") + `<div class="sum-legend small muted">${LEVELS.map((l) => `${l.v} ${l.label}`).join(" · ")}</div>`;
    $$("#rb-summary [data-goto]").forEach((li) => li.addEventListener("click", () => {
      const el = $(`.crit[data-crit="${li.dataset.goto}"]`);
      el?.scrollIntoView({ behavior: "smooth", block: "center" });
    }));
  }
  refreshFoot();

  /* ---------- eventos ---------- */
  $$(".lvl").forEach((b) => b.addEventListener("click", () => {
    const c = b.dataset.c, v = +b.dataset.v;
    e.scores[c] = v;
    $$(`.lvl[data-c="${c}"]`).forEach((x) => x.setAttribute("aria-checked", x === b));
    const wrap = $(`[data-exc-wrap="${c}"]`);
    wrap.hidden = v !== 4;
    if (v === 4 && !String(e.excede[c] || "").trim()) setTimeout(() => $("textarea", wrap).focus(), 60);
    schedule(250);
  }));
  $$("[data-exc]").forEach((t) => t.addEventListener("input", () => { e.excede[t.dataset.exc] = t.value; schedule(); }));
  $$(".lvl-group").forEach((g) => g.addEventListener("keydown", (ev) => {
    if (!["ArrowRight", "ArrowLeft"].includes(ev.key)) return;
    const bs = $$(".lvl", g), i = bs.indexOf(document.activeElement);
    const j = Math.max(0, Math.min(bs.length - 1, i + (ev.key === "ArrowRight" ? 1 : -1)));
    bs[j].focus(); bs[j].click(); ev.preventDefault();
  }));
  $$(".yn").forEach((b) => b.addEventListener("click", () => {
    e.recommend = b.dataset.rec === "1";
    $$(".yn").forEach((x) => x.setAttribute("aria-checked", x === b));
    schedule(250);
  }));
  $("#rb-com").addEventListener("input", (ev) => { e.comments = ev.target.value; schedule(); });
  $("#rb-org").addEventListener("input", (ev) => { e.orgComments = ev.target.value; schedule(); });
  const leave = () => { ui.flushRubric(); backToList(); };
  $("#rb-back").addEventListener("click", leave);
  $("#rb-back2")?.addEventListener("click", leave);

  $("#rb-send")?.addEventListener("click", async () => {
    const miss = missingItems(e);
    if (miss.length) {
      toast("Falta preencher: " + miss.join(", ") + ".", "err");
      const firstCrit = ALL_CRITS.find((c) => !e.scores[c.id]);
      const firstExc = excedeMissing(e)[0];
      const target = firstCrit ? $(`.crit[data-crit="${firstCrit.id}"]`)
        : firstExc ? $(`#exc-${firstExc.id}`)
        : (e.recommend !== true && e.recommend !== false) ? $(".yn-group")
        : $("#rb-com");
      target?.scrollIntoView({ behavior: "smooth", block: "center" });
      target?.classList.add("flash");
      setTimeout(() => target?.classList.remove("flash"), 1400);
      if (target?.matches("textarea,input")) setTimeout(() => target.focus(), 400);
      return;
    }
    const ok = await confirmModal("Enviar avaliação",
      `Enviar a avaliação de <b>${esc(team.name)}</b> com indicação <b>${e.recommend ? "SIM" : "NÃO"}</b> para a próxima etapa?
       <br><br>Depois de enviada, só a organização consegue reabrir.`, "Enviar");
    if (!ok) return;
    clearTimeout(timer); timer = null;
    Object.keys(e.excede).forEach((k) => { if (e.scores[k] !== 4) delete e.excede[k]; });
    const cur = myEval(team.id);
    await store.put("evaluations", {
      ...e, judgeName: session.user.name, teamName: team.name,
      createdAt: cur?.createdAt || nowISO(), status: "sent", sentAt: nowISO(),
      firstSentAt: cur?.firstSentAt || nowISO(),
    });
    toast(`Avaliação de ${team.name} enviada.`);
    backToList();
  });

  window.scrollTo(0, 0);
}



/* ============================================================
   8.5 EQUIPE — devolutiva
   Só aparece depois que a organização libera. Uma rubrica única:
   em cada critério, média das avaliações ENVIADAS arredondada para
   baixo (3,16 → 3; 2,83 → 2). Se algum avaliador deu 4 (Excede) no
   critério, a justificativa dele aparece como feedback, em azul, mesmo
   que a média fique abaixo de 4. Notas 1, 2 e 3 não trazem comentário.
   Nunca mostra indicação, notas, deliberação, comentários para a
   organização, observações internas nem nomes.
   ============================================================ */
function renderTeamHome(root) {
  const t = session.user;
  const cfg = settings();

    .sort((a, b) => (a.firstSentAt || a.sentAt || "").localeCompare(b.firstSentAt || b.sentAt || ""));

  const head = `

          : "A organização do evento vai liberar a Rubrica de Avaliação e os comentários dos avaliadores. Quando isso acontecer, eles aparecem aqui, nesta mesma página."}</p>
        <p class="small muted">Esta página se atualiza sozinha.</p>

  }

      com o resultado de <b>${sent.length} avaliador${sent.length > 1 ? "es" : ""}</b>.</div></div>
    ${teamRubricHTML(sent)}
  </div>`;
  $("#tm-print")?.addEventListener("click", () => window.print());
}

/* nível do critério para a equipe: média das avaliações, arredondada para baixo */
function teamLevel(sent, cid) {
  const vals = sent.map((e) => e.scores?.[cid]).filter(Boolean);
  if (!vals.length) return null;
  return Math.floor(vals.reduce((a, b) => a + b, 0) / vals.length + 1e-9);
}

function teamRubricHTML(sent) {
  return `
  <article class="tm-sheet">
    <div class="tm-sheet-head">
      <h2>Rubrica de Avaliação</h2>
      <span class="small muted">${fmtDate(sent.map((e) => e.sentAt).sort().pop())}</span>
    </div>
    <div class="tm-legend small">
      ${LEVELS.map((l) => `<span><span class="lvl-dot l${l.v}"></span><b>${l.label}:</b> ${esc(l.desc.replace(/^A equipe /, "a equipe "))}</span>`).join("")}
    </div>
    ${RUBRIC.map((sec) => `
      <section class="rub-sec tm-sec">
        <h3 class="rub-bar"><span class="msym">${sec.icon}</span>${esc(sec.title)}</h3>
        <div class="tm-grid-head" aria-hidden="true"><span></span>${LEVELS.map((l) => `<span>${l.label}</span>`).join("")}</div>
        ${sec.crits.map((c) => {
          const v = teamLevel(sent, c.id);
          const fb = [...new Set(sent.filter((e) => e.scores?.[c.id] === 4).map((e) => String(e.excede?.[c.id] || "").trim()).filter(Boolean))];
          return `<div class="tm-row">
            <div class="crit-txt"><div class="crit-q">${esc(c.q)}</div><div class="crit-d">${esc(c.d)}</div></div>
            ${LEVELS.map((l) => `<span class="tm-cell ${v === l.v ? "on l" + l.v : ""}" title="${attr(l.label)}">
              ${v === l.v ? `<span class="msym">check</span>` : ""}<span class="tm-cell-lbl">${l.label}</span></span>`).join("")}
            ${fb.length ? `<div class="tm-fb"><span class="msym sm">star</span><div><b>Feedback dos avaliadores</b>
              ${fb.map((t) => `<p>${esc(t)}</p>`).join("")}</div></div>` : ""}
          </div>`;
        }).join("")}
      </section>`).join("")}
  </article>`;
}

/* ============================================================
   8.4 ORGANIZAÇÃO — painel
   Consolida apenas avaliações ENVIADAS.
   Categoria = média dos 2 critérios (1 a 4) em cada rubrica;
   média da categoria = média entre as rubricas da equipe.
   Nota classificatória = soma das 5 médias de categoria (5 a 20).
   ============================================================ */
const MAX_TOTAL = RUBRIC.length * 4;
function settings(evId = session.eventId) { return store.get("settings", evId) || { id: evId, released: false }; }
function evalTotal(e) { return RUBRIC.reduce((a, sec) => a + secScore(e, sec), 0); }
function secScore(e, sec) { return sec.crits.reduce((a, c) => a + (e.scores?.[c.id] || 0), 0) / sec.crits.length; }
let DECIMALS = 2;
try { DECIMALS = [2, 3, 4].includes(+localStorage.getItem("explore.dec")) ? +localStorage.getItem("explore.dec") : 2; } catch (e) { /* ignora */ }
/* médias: inteiro sem casas; demais com a quantidade de casas escolhida na deliberação */
const fmtN = (v) => (v === null || v === undefined ? "—" : fmt(v, Number.isInteger(v) ? 0 : DECIMALS));
function judgeLabel(e) {
  const v = ACCESS.volunteers.find((x) => x.id === e.judgeId);
  return v ? v.name : e.judgeName || "—";
}
/* "Maria Souza Lima" → "Maria L." */
function shortName(n) {
  const p = String(n || "").trim().split(/\s+/);
  return p.length > 1 ? `${p[0]} ${p[p.length - 1][0]}.` : p[0] || "—";
}
function teamSummary(t) {
  const all = evalsOfTeam(t.id);
  const sent = all.filter((e) => e.status === "sent");
  const yes = sent.filter((e) => e.recommend === true).length;
  return {
    t, all, sent, yes, no: sent.length - yes,
    drafts: all.filter((e) => e.status !== "sent").length,
    secs: RUBRIC.map((sec) => (sent.length ? avg(sent.map((e) => secScore(e, sec))) : null)),
    get total() { return this.sent.length ? this.secs.reduce((a, b) => a + b, 0) : null; },
    exc: sent.reduce((a, e) => a + ALL_CRITS.filter((c) => e.scores?.[c.id] === 4).length, 0),
    org: sent.filter((e) => String(e.orgComments || "").trim()).length,
  };
}
function recChip(yes, n) {
  if (!n) return `<span class="muted">—</span>`;
  const cls = yes === n ? "chip-ok" : yes === 0 ? "chip-crit" : "chip-warn";
  return `<span class="chip ${cls}" title="${yes} de ${n} avaliador(es) indicaram"><span class="msym">${yes ? "thumb_up" : "thumb_down"}</span>${yes}/${n} sim</span>`;
}
function scoreCell(v, max) {
  if (v === null || v === undefined) return `<span class="muted">—</span>`;
  const r = v / max;
  const lv = r > 0.875 ? 4 : r > 0.625 ? 3 : r > 0.375 ? 2 : 1;
  return `<span class="score-pill l${lv}">${fmtN(v)}</span>`;
}

/* ============================================================
   8.6 ORGANIZAÇÃO — deliberação (só a organização vê)
   Classificação: ordem da nota classificatória. As primeiras
   ocupam as vagas, as seguintes são suplentes. A organização pode
   forçar Classificada / Suplente / Não classificada; as demais
   se reorganizam sozinhas.
   Premiação: cada equipe recebe UM prêmio.
   1. Ciclos Core › Challenge › Model › Coding › Poster: cada prêmio
      vai para a maior média da categoria entre as equipes que ainda
      não ganharam (quem já ganhou passa a vez). Terminou o ciclo,
      recomeça em Core.
   2. Fechamento: quando sobram menos equipes que categorias, cada
      uma, na ordem da nota, leva a sua melhor categoria, sem repetir
      prêmio dentro do fechamento (empate: Core › … › Poster).
   Empate entre equipes: nota classificatória › Core › Challenge ›
   Model › Coding › Poster.
   Troca manual afeta só a equipe trocada: as outras mantêm o prêmio.
   ============================================================ */
const CAT_ORDER = ["cv", "cs", "tm", "cd", "tp"];
const CAT = {
  cv: { short: "Core", award: "Core Values Award" },
  cs: { short: "Challenge", award: "Challenge Solution Award" },
  tm: { short: "Model", award: "Team Model Award" },
  cd: { short: "Coding", award: "Coding Award" },
  tp: { short: "Poster", award: "Team Poster Award" },
};
function delibCfg() {
  const c = settings();
  return { vagas: Number.isFinite(c.vagas) ? c.vagas : 3, suplentes: Number.isFinite(c.suplentes) ? c.suplentes : 2 };
}
function delibOf(teamId) { return store.get("deliberation", teamId) || { id: teamId }; }
function awardName(cat, round) { return CAT[cat].award + (round > 1 ? ` · ${round}º` : ""); }

/* linhas ordenadas pela nota classificatória; empate: Core, Challenge, Model, Coding, Poster, nome */
function delibRows() {
  const rows = ACCESS.teams.map(teamSummary).filter((r) => r.sent.length).map((r) => {
    const cat = {};
    RUBRIC.forEach((sec, i) => { cat[sec.id] = r.secs[i]; });
    return { ...r, total: r.total, cat, d: delibOf(r.t.id) };
  });
  const eq = (a, b) => Math.abs(a - b) < 1e-9;
  rows.sort((a, b) => {
    if (!eq(a.total, b.total)) return b.total - a.total;
    for (const k of CAT_ORDER) if (!eq(a.cat[k], b.cat[k])) return b.cat[k] - a.cat[k];
    return byName(a.t, b.t);
  });
  rows.forEach((r, i) => {
    r.rank = i + 1;
    r.tie = rows.some((o) => o !== r && eq(o.total, r.total));
  });
  return rows;
}

function computeDeliberation() {
  const rows = delibRows();
  const cfg = delibCfg();
  /* classificação */
  const forcedClass = rows.filter((r) => r.d.status === "class").length;
  const forcedSup = rows.filter((r) => r.d.status === "sup").length;
  let vagasLeft = Math.max(0, cfg.vagas - forcedClass);
  let supLeft = Math.max(0, cfg.suplentes - forcedSup);
  rows.forEach((r) => {
    if (r.d.status) { r.result = r.d.status; r.manualResult = true; return; }
    if (vagasLeft > 0) { r.result = "class"; vagasLeft--; }
    else if (supLeft > 0) { r.result = "sup"; supLeft--; }
    else r.result = "nao";
  });
  let v = 0, sp = 0;
  rows.forEach((r) => { if (r.result === "class") r.slot = ++v; else if (r.result === "sup") r.slot = ++sp; });

  /* premiação automática (sem olhar as trocas manuais) */
  const eps = 1e-9;
  const byCat = (k) => (a, b) => (Math.abs(a.cat[k] - b.cat[k]) > eps ? b.cat[k] - a.cat[k] : a.rank - b.rank);
  let pool = rows.slice();
  let cycle = 0;
  while (pool.length) {
    cycle++;
    if (pool.length < CAT_ORDER.length) {
      /* fechamento: cada equipe leva a sua melhor categoria, sem repetir */
      const used = new Set();
      pool.forEach((r) => {
        let best = null;
        CAT_ORDER.forEach((k) => { if (!used.has(k) && (best === null || r.cat[k] > r.cat[best] + eps)) best = k; });
        used.add(best);
        r.auto = { cat: best, round: cycle, how: "fechamento" };
      });
      break;
    }
    for (const k of CAT_ORDER) {
      const win = pool.slice().sort(byCat(k))[0];
      win.auto = { cat: k, round: cycle, how: "ciclo" };
      pool = pool.filter((r) => r !== win);
    }
  }
  const count = Object.fromEntries(CAT_ORDER.map((k) => [k, 0]));
  rows.forEach((r) => {
    r.auto.label = awardName(r.auto.cat, r.auto.round);
    const a = r.d.award;
    if (!a) { r.award = r.auto; count[r.auto.cat]++; return; }
    r.manualAward = true;
    if (CAT[a]) { r.award = { cat: a, round: 99, label: CAT[a].award }; count[a]++; }
    else if (a === "own") r.award = { own: true, label: r.d.awardCustom || "Crie o seu prêmio" };
    else r.award = { none: true, label: "Sem prêmio" };
  });
  return { rows, cfg, count };
}

function resultChip(r) {
  const m = r.manualResult ? ` <span class="msym sm" title="Definido manualmente">push_pin</span>` : "";
  if (r.result === "class") return `<span class="chip chip-ok"><span class="msym">verified</span>Vaga ${r.slot}${m}</span>`;
  if (r.result === "sup") return `<span class="chip chip-warn"><span class="msym">hourglass_top</span>Suplente ${r.slot}${m}</span>`;
  return `<span class="chip ${r.manualResult ? "chip-crit" : "chip-out"}"><span class="msym">${r.manualResult ? "block" : "remove"}</span>Não classificada${m}</span>`;
}

function renderDelib(root) {
  const { rows, cfg } = computeDeliberation();
  root.style.maxWidth = "1280px";
  const noEval = ACCESS.teams.filter((t) => !evalsOfTeam(t.id).some((e) => e.status === "sent")).sort(byName);
  const tab = ui.delibTab;
  const sortKey = ui.delibSort.key, dir = ui.delibSort.dir;
  const val = (r, k) => (k === "rank" ? -r.rank : k === "total" ? r.total : k === "name" ? r.t.name : r.cat[k]);
  const shown = rows.slice().sort((a, b) => {
    const x = val(a, sortKey), y = val(b, sortKey);
    const c = typeof x === "string" ? x.localeCompare(y, "pt-BR") * -1 : x - y;
    return c * dir || a.rank - b.rank;
  });
  const th = (k, label, cls = "num") => `<th class="${cls} sortable ${sortKey === k ? "on" : ""}" data-sort="${k}">${label}${sortKey === k ? `<span class="msym sm">${dir < 0 ? "arrow_downward" : "arrow_upward"}</span>` : ""}</th>`;
  const catCells = (r, hl) => CAT_ORDER.map((k) => `<td class="num ${hl && r.award?.cat === k ? "aw-cell" : ""}">${scoreCell(r.cat[k], 4)}</td>`).join("");

  root.innerHTML = `
    <div class="page-head">
      <div class="grow">
        <div class="eyebrow">${eventEyebrow()}</div>
        <h1>Deliberação</h1>
        <p class="muted small"><span class="msym sm" style="vertical-align:-3px">visibility_off</span> Só a organização vê esta página. Classificação, prêmios e observações não aparecem para as equipes.</p>
      </div>
      <div class="row g-2xs wrap">
        <div class="seg dec-seg" role="group" aria-label="Casas decimais" title="Casas decimais das médias">
          <button disabled class="dec-lbl">Casas</button>

  const lbl = (v, l) => (cur === v && v ? (v === "class" ? `Vaga ${r.slot}` : v === "sup" ? `Suplente ${r.slot}` : l) : l);
  return `<label class="inl-sel res-${r.result} ${r.manualResult ? "manual" : ""}">
    <span class="msym">${r.result === "class" ? "verified" : r.result === "sup" ? "hourglass_top" : r.manualResult ? "block" : "remove"}</span>

function awardSelect(r) {

/* observação da deliberação (só organização) */
function editDelibNote(r, tab) {
  const key = tab === "class" ? "classNote" : "awardNote";
  askText(`Observação · ${r.t.name}`, tab === "class" ? "Sobre a classificação (só a organização vê)" : "Sobre o prêmio (só a organização vê)",
    tab === "class" ? "Ex.: Não classificada por descumprir a regra X." : "Ex.: Banca preferiu destacar o Team Model.", r.d[key] || "", true)
    .then(async (txt) => {
      if (txt === null) return;
      await store.put("deliberation", { ...r.d, id: r.t.id, [key]: txt });
      toast(txt ? "Observação salva." : "Observação removida.");
    });
}

/* janelinha com um campo de texto; devolve o texto ou null se cancelar */
function askText(title, label, placeholder, value, multiline) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    openModal({
      title, icon: multiline ? "chat" : "edit",
      body: `<div class="field"><label for="ask-t">${esc(label)}</label>
        ${multiline ? `<textarea id="ask-t" rows="3" placeholder="${attr(placeholder)}">${esc(value || "")}</textarea>`
                    : `<input type="text" id="ask-t" placeholder="${attr(placeholder)}" value="${attr(value || "")}">`}</div>`,
      footer: `<button class="btn btn-text" data-close>Cancelar</button><button class="btn btn-fill" data-ok>Salvar</button>`,
      onMount: (el, close) => {
        const t = $("#ask-t", el);
        const ok = () => { const v = t.value.trim(); close(); finish(multiline ? v : v || null); };
        $("[data-ok]", el).addEventListener("click", ok);
        if (!multiline) t.addEventListener("keydown", (ev) => { if (ev.key === "Enter") ok(); });
        $$("[data-close]", el).forEach((b) => b.addEventListener("click", () => finish(null)));
        el.addEventListener("mousedown", (ev) => { if (ev.target === el) finish(null); });
        document.addEventListener("keydown", function esc1(ev) { if (ev.key === "Escape") { finish(null); document.removeEventListener("keydown", esc1); } });
      },
    });
  });
}

/* ---------- exportação ---------- */
function exportExcel() {
  if (typeof XLSX === "undefined") return toast("Biblioteca de planilhas indisponível (sem internet?).", "err");
  const lvl = (v) => (v ? `${v} - ${LEVELS.find((l) => l.v === v).label}` : "");
  const teams = ACCESS.teams.slice().sort(byName);
  const evals = evalsOfEvent();

  const resumo = teams.map((t) => {
    const r = teamSummary(t);
    const row = { "Nº equipe": t.number, "Equipe": t.name, "Escola": t.school, "Cidade": t.city, "Avaliações enviadas": r.sent.length };
    RUBRIC.forEach((sec, i) => { row[`${sec.title} (média 1-4)`] = r.secs[i] === null ? "" : +r.secs[i].toFixed(4); });
    row["Nota classificatória (5-20)"] = r.total === null ? "" : +r.total.toFixed(4);
    row["Indicações SIM"] = r.yes;
    row["Indicações NÃO"] = r.no;
    row["Notas Excede"] = r.exc;
    return row;
  });
  const nums = evalNumbers();
  const detalhe = evals.slice().sort((a, b) => (nums[a.id] || "ZZ").localeCompare(nums[b.id] || "ZZ") || (a.teamName || "").localeCompare(b.teamName || "", "pt-BR")).map((e) => {
    const t = ACCESS.teams.find((x) => x.id === e.teamId) || {};
    const v = ACCESS.volunteers.find((x) => x.id === e.judgeId) || {};
    const row = { "Nº avaliação": nums[e.id] || "(não enviada)", "Nº equipe": t.number || "", "Equipe": t.name || e.teamName, "Avaliador(a)": judgeLabel(e), "CPF avaliador": v.cpf ? fmtCPF(v.cpf) : "",
      "Situação": { sent: "Enviada", draft: "Rascunho", reopened: "Reaberta" }[e.status] || e.status };
    RUBRIC.forEach((sec) => sec.crits.forEach((c) => {
      row[`${sec.title} · ${c.short}`] = e.scores?.[c.id] || "";
      if (e.scores?.[c.id] === 4) row[`${sec.title} · ${c.short} · justificativa`] = e.excede?.[c.id] || "";
    }));
    row["Nota da rubrica (5-20)"] = +evalTotal(e).toFixed(4);
    row["Indica próxima etapa"] = e.recommend === true ? "Sim" : e.recommend === false ? "Não" : "";
    row["Comentários (equipe)"] = e.comments || "";
    row["Comentários para a organização"] = e.orgComments || "";
    row["Primeiro envio"] = e.firstSentAt || e.sentAt ? fmtDTs(e.firstSentAt || e.sentAt) : "";
    row["Último envio"] = e.sentAt ? fmtDTs(e.sentAt) : "";
    row["Observação da organização"] = e.orgNote || "";
    row["Texto corrigido pela organização"] = e.orgEditedAt ? "Sim, em " + fmtDTs(e.orgEditedAt) : "";
    row["Comentários originais do avaliador"] = e.orgEditedAt ? e.original?.comments || "" : "";
    return row;
  });
  /* todas as colunas de justificativa em todas as linhas, na ordem da rubrica */
  const cols = ["Nº avaliação", "Nº equipe", "Equipe", "Avaliador(a)", "CPF avaliador", "Situação"];
  RUBRIC.forEach((sec) => sec.crits.forEach((c) => {
    cols.push(`${sec.title} · ${c.short}`);
    if (detalhe.some((r) => `${sec.title} · ${c.short} · justificativa` in r)) cols.push(`${sec.title} · ${c.short} · justificativa`);
  }));
  cols.push("Nota da rubrica (5-20)", "Indica próxima etapa", "Comentários (equipe)", "Comentários para a organização",
    "Primeiro envio", "Último envio", "Observação da organização", "Texto corrigido pela organização", "Comentários originais do avaliador");
  const avaliadores = ACCESS.volunteers.filter((v) => v.role === "judge").sort(byName).map((v) => {
    const mine = evals.filter((e) => e.judgeId === v.id);
    return { "Avaliador(a)": v.name, "CPF": fmtCPF(v.cpf), "Enviadas": mine.filter((e) => e.status === "sent").length, "Em aberto": mine.filter((e) => e.status !== "sent").length };
  });

  const wb = XLSX.utils.book_new();
  const add = (name, rows, header) => {
    const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{}], header ? { header } : undefined);
    const keys = header || Object.keys(rows[0] || {});
    ws["!cols"] = keys.map((k) => ({ wch: Math.min(60, Math.max(8, k.length + 2, ...rows.map((r) => String(r[k] ?? "").length + 1))) }));
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  add("Resumo por equipe", resumo);
  add("Avaliações", detalhe, cols);
  add("Avaliadores", avaliadores);
  const { rows: dl } = computeDeliberation();
  add("Deliberação", dl.map((r) => {
    const row = { "Posição": r.rank, "Nº equipe": r.t.number, "Equipe": r.t.name, "Avaliações": r.sent.length };
    CAT_ORDER.forEach((k) => { row[`${CAT[k].short} (média)`] = +r.cat[k].toFixed(4); });
    row["Nota classificatória"] = +r.total.toFixed(4);
    row["Empate"] = r.tie ? "Sim" : "";
    row["Resultado"] = r.result === "class" ? `Vaga ${r.slot}` : r.result === "sup" ? `Suplente ${r.slot}` : "Não classificada";
    row["Resultado manual"] = r.manualResult ? "Sim" : "";
    row["Obs. classificação"] = r.d.classNote || "";
    row["Prêmio"] = r.award.label;
    row["Prêmio manual"] = r.manualAward ? "Sim" : "";
    row["Obs. prêmio"] = r.d.awardNote || "";
    return row;
  }));
  const stamp = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, "");
  const slug = norm(currentEvent()?.name || "evento").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  XLSX.writeFile(wb, `avaliacao-${slug}-${stamp}.xlsx`);
  toast("Planilha gerada.");
}

function eventCounts(ev) {
  const teams = teamsOf(ev.id);
  const people = peopleOf(ev.id);
  return {
    teams: teams.length,
    judges: people.filter((u) => u.roles[ev.id].includes("avaliador")).length,
    sent: evalsOfEvent(ev.id).filter((e) => e.status === "sent").length,
    regionals: people.filter((u) => u.roles[ev.id].includes("regional")),
  };
}

function enterEvent(evId, tab) {
  session.eventId = evId;

  session.save();
  if (location.hash) history.replaceState(null, "", location.pathname);
  store.audit(evId, "Entrou no evento", store.get("events", evId)?.name || "");
  render();
  window.scrollTo(0, 0);
}

function deleteEventModal(ev) {
  if (!ev || !can.nac()) return;
  const teams = teamsOf(ev.id), evals = evalsOfEvent(ev.id), people = peopleOf(ev.id);
  openModal({
    title: "Excluir evento", icon: "delete_forever", size: "wide",
    body: `
      <div class="banner crit" style="margin-bottom:var(--sp-md)"><span class="msym">warning</span>
        <div><b>Esta ação não pode ser desfeita.</b> Tudo o que foi lançado neste evento será apagado para todos.</div></div>
      <div class="tbl-wrap" style="margin-bottom:var(--sp-md)"><table><tbody>
        <tr><td>Equipes (com os acessos delas)</td><td class="num mono">${teams.length}</td></tr>
        <tr><td>Avaliações</td><td class="num mono">${evals.length}</td></tr>
        <tr><td>Voluntários vinculados (a pessoa continua existindo, só perde a função neste evento)</td><td class="num mono">${people.length}</td></tr>
      </tbody></table></div>
      <div class="field"><label for="del-confirm">Para confirmar, digite o nome do evento: <b>${esc(ev.name)}</b></label>
        <input id="del-confirm" type="text" autocomplete="off"></div>`,
    footer: `<button class="btn btn-text" data-close>Cancelar</button>
             <button class="btn btn-danger" data-confirm disabled><span class="msym">delete_forever</span>Excluir definitivamente</button>`,
    onMount: (el, close) => {
      const inp = $("#del-confirm", el), btn = $("[data-confirm]", el);
      inp.addEventListener("input", () => { btn.disabled = inp.value.trim() !== ev.name.trim(); });
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        ui.silent = true;
        for (const e of evals) await store.remove("evaluations", e.id);
        for (const t of teams) { await store.remove("deliberation", t.id); await store.remove("teams", t.id); }
        for (const u of people) { const roles = { ...u.roles }; delete roles[ev.id]; await store.put("users", { ...u, roles }); }
        for (const r of roomsOf(ev.id)) await store.remove("rooms", r.id);
        await store.remove("settings", ev.id);
        await store.remove("events", ev.id);
        ui.silent = false;
        await store.audit(null, "Evento excluído", `${ev.name} · ${teams.length} equipes · ${evals.length} avaliações`);
        close();
        toast(`Evento "${ev.name}" excluído.`);
        render();
      });
    },
  });
}

function cpfFromCell(v) {
  let d = onlyDigits(v);
  if (d.length >= 8 && d.length < 11) d = d.padStart(11, "0");   /* Excel costuma engolir o zero à esquerda */

/* adicionar (u = null) ou editar pessoa; opts.nacional = cadastro da Operação Nacional */
function personFormModal(u, opts = {}) {

  const isNew = !u;
  const nacMode = !!opts.nacional;
  const cur = u && ev ? u.roles?.[ev.id] || [] : ["avaliador"];
  openModal({
    title: nacMode ? "Adicionar à Operação Nacional" : isNew ? "Adicionar voluntário" : "Editar voluntário", icon: "person_add",
    body: `
      <div class="stack g-md">
        <div class="field"><label for="pf-cpf">CPF <span class="req">*</span></label>
          <input id="pf-cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" value="${u ? fmtCPF(u.cpf) : ""}" ${u ? "disabled" : ""}>
          <span class="hint" id="pf-found"></span></div>
        <div class="field"><label for="pf-name">Nome completo <span class="req">*</span></label><input id="pf-name" type="text" value="${attr(u?.name || "")}"></div>
        <div class="field" id="pf-pw-wrap" ${isNew ? "" : "hidden"}><label for="pf-pw">Senha <span class="req">*</span></label>
          <div class="row g-2xs"><input id="pf-pw" type="text" autocomplete="off" style="flex:1"><button type="button" class="btn btn-out btn-sm" id="pf-gen">Gerar</button></div>
          <span class="hint">Use a senha que você já entregou para a pessoa, ou gere uma.</span></div>
        ${nacMode ? "" : `<div class="field"><label for="pf-room">Sala</label>
          <select id="pf-room"><option value="">Sem sala</option>${roomsOf(ev.id).map((r) => `<option value="${attr(r.id)}" ${u && judgeRoomId(u, ev.id) === r.id ? "selected" : ""}>${esc(r.name)}</option>`).join("")}</select>
          <span class="hint">${roomsOf(ev.id).length ? "O avaliador só vê as equipes da sala dele." : "Crie as salas na aba Salas."}</span></div>`}
        ${nacMode ? "" : `<div class="field"><label>Funções neste evento <span class="req">*</span></label>
          <div class="stack g-2xs">${ROLE_ORDER.map((r) => `<label class="opt-line"><input type="checkbox" data-role="${r}" ${cur.includes(r) ? "checked" : ""} ${r === "regional" && !can.nac() ? "disabled" : ""}>
            <span><b>${ROLES[r].label}</b><span class="small muted"> — ${{ regional: "organiza as pessoas e as equipes do evento", lider: "painel, correções, deliberação e devolutiva", avaliador: "preenche as rubricas" }[r]}${r === "regional" && !can.nac() ? " (só a Operação Nacional nomeia)" : ""}</span></span></label>`).join("")}</div></div>`}
      </div>`,
    footer: `<button class="btn btn-text" data-close>Cancelar</button><button class="btn btn-fill" data-ok><span class="msym">save</span>Salvar</button>`,
    onMount: (el, close) => {
      const cpfIn = $("#pf-cpf", el);
      let existing = u || null;
      cpfIn.addEventListener("input", () => {
        cpfIn.value = maskCPF(cpfIn.value);
        const d = onlyDigits(cpfIn.value);
        existing = d.length === 11 ? store.get("users", "vol-" + d) : null;
        $("#pf-found", el).textContent = existing ? `Já cadastrado: ${existing.name}. A senha atual continua valendo.` : "";
        $("#pf-pw-wrap", el).hidden = !!existing;
        if (existing) $("#pf-name", el).value = existing.name;
        if (existing && ev && $("#pf-room", el)) $("#pf-room", el).value = judgeRoomId(existing, ev.id);
        if (existing && ev) $$("[data-role]", el).forEach((c) => { if (!c.disabled) c.checked = (existing.roles?.[ev.id] || ["avaliador"]).includes(c.dataset.role); });
      });
      $("#pf-gen", el)?.addEventListener("click", () => { $("#pf-pw", el).value = randPassword(8); });
      $("[data-ok]", el).addEventListener("click", async () => {
        const cpf = u ? u.cpf : onlyDigits(cpfIn.value);
        const name = $("#pf-name", el).value.trim();
        if (cpf.length !== 11) return toast("CPF precisa ter 11 números.", "err");
        if (!name) return toast("Informe o nome.", "err");
        const base = existing || store.get("users", "vol-" + cpf);
        let roles = null;
        if (!nacMode) {
          roles = $$("[data-role]", el).filter((c) => c.checked).map((c) => c.dataset.role);
          const had = base?.roles?.[ev.id] || [];
          if (!can.nac()) roles = roles.filter((r) => r !== "regional").concat(had.includes("regional") ? ["regional"] : []);
          if (!roles.length) return toast("Marque pelo menos uma função.", "err");
        }
        let rec;
        if (base) {
          rec = { ...base, name, active: true };
        } else {
          const pw = $("#pf-pw", el).value.trim();
          if (pw.length < 4) return toast("Informe uma senha (mínimo 4 caracteres) ou clique em Gerar.", "err");
          const salt = randSalt();
          rec = { id: "vol-" + cpf, cpf, name, salt, pwHash: await hashPw(salt, pw), active: true, nacional: false, roles: {}, createdAt: nowISO() };
          opts.newPw = pw;
        }
        if (nacMode) rec.nacional = true;
        else {
          rec.roles = { ...(rec.roles || {}), [ev.id]: ROLE_ORDER.filter((r) => roles.includes(r)) };
          rec.rooms = { ...(rec.rooms || {}), [ev.id]: $("#pf-room", el).value };
        }
        await store.put("users", rec);
        await store.audit(ev?.id || null, nacMode ? "Adicionado à Operação Nacional" : isNew ? "Voluntário vinculado" : "Voluntário editado", `${name} · ${fmtCPF(cpf)}`);
        close();
        if (opts.newPw) credList("Acesso criado", [{ name, login: fmtCPF(cpf), pw: opts.newPw }]);
        else toast("Salvo.");
      });
    },
  });
}

function resetPasswordModal(col, rec) {
  if (col === "users" && rec.nacional && !can.nac()) return toast("Só a Operação Nacional altera a senha de quem é da Nacional.", "err");
  const other = col === "users" ? Object.keys(rec.roles || {}).filter((k) => k !== session.eventId && rec.roles[k].length).length : 0;
  openModal({
    title: "Nova senha", icon: "key",
    body: `<p style="margin-bottom:var(--sp-md)">Nova senha para <b>${esc(rec.name)}</b>.${other ? ` Vale também para os outros ${other} evento(s) desta pessoa.` : ""}</p>
      <div class="field"><label for="rp-pw">Senha</label><div class="row g-2xs"><input id="rp-pw" type="text" autocomplete="off" style="flex:1" value="${attr(randPassword(8))}">
        <button type="button" class="btn btn-out btn-sm" id="rp-gen">Gerar outra</button></div></div>`,
    footer: `<button class="btn btn-text" data-close>Cancelar</button><button class="btn btn-fill" data-ok>Salvar senha</button>`,
    onMount: (el, close) => {
      $("#rp-gen", el).addEventListener("click", () => { $("#rp-pw", el).value = randPassword(8); });
      $("[data-ok]", el).addEventListener("click", async () => {
        const pw = $("#rp-pw", el).value.trim();
        if (pw.length < 4) return toast("Senha muito curta.", "err");
        const salt = randSalt();
        await store.put(col, { ...rec, salt, pwHash: await hashPw(salt, pw) });
        await store.audit(session.eventId, "Senha redefinida", rec.name);
        close();
        credList("Senha alterada", [{ name: rec.name, login: col === "users" ? fmtCPF(rec.cpf) : rec.name, pw }]);
      });
    },
  });
}
function credList(title, list, note) {

function downloadTemplate(file, sheet, rows, notes) {
  if (typeof XLSX === "undefined") return toast("Biblioteca de planilhas indisponível (sem internet?).", "err");
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = rows[0].map((h) => ({ wch: Math.max(14, String(h).length + 10) }));
  XLSX.utils.book_append_sheet(wb, ws, sheet);
  const wi = XLSX.utils.aoa_to_sheet(notes.map((n) => [n]));
  wi["!cols"] = [{ wch: 110 }];
  XLSX.utils.book_append_sheet(wb, wi, "Instruções");
  XLSX.writeFile(wb, file);
}

function pickSheetRows() {
  return new Promise((resolve) => {
    if (typeof XLSX === "undefined") { toast("Biblioteca de planilhas indisponível (sem internet?). Use Colar do Excel.", "err"); return resolve(null); }
    const inp = document.createElement("input");
    inp.type = "file";
    inp.accept = ".xlsx,.xls,.csv";
    inp.addEventListener("change", async () => {
      const f = inp.files[0];
      if (!f) return resolve(null);
      try {
        const wb = XLSX.read(await f.arrayBuffer());
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: "" });
        const head = (aoa[0] || []).map(norm);
        resolve(aoa.slice(1).filter((r) => r.some((c) => String(c).trim())).map((r, i) => {
          const row = { _linha: i + 2 };
          head.forEach((h, j) => { row[h] = String(r[j] ?? "").trim(); });
          return row;
        }));
      } catch (e) { toast("Não foi possível ler a planilha. Use o modelo.", "err"); resolve(null); }
    });
    inp.click();
  });
}
function pasteModal(title, header, onRows) {

    footer: `<button class="btn btn-text" data-close>Cancelar</button><button class="btn btn-fill" data-ok><span class="msym">upload</span>Importar</button>`,
    onMount: (el, close) => {
      $("[data-ok]", el).addEventListener("click", () => {

        if (!rows.length) return toast("Cole o cabeçalho e pelo menos uma linha.", "err");

}
function parseRoleList(txt) {
  const out = new Set();
  String(txt || "").split(/[;,/|+]/).map(norm).forEach((p) => {
    if (!p) return;
    if (p.startsWith("lider") || p.includes("lider")) out.add("lider");
    else if (p.includes("regional") || p.startsWith("operador")) out.add("regional");
    else if (p.startsWith("avali") || p.startsWith("juiz")) out.add("avaliador");
  });
  return [...out];
}
